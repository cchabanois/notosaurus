<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#eaf3fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Notosaurus</title>
  <!-- The web page's style and languages (the repository's static/): texts under "android" -->
  <link rel="stylesheet" href="style.css">
  <script defer src="saved.js"></script>
  <script defer src="i18n.js"></script>
  <script defer src="voice-choice.js"></script>
  <script defer src="ask-confirm.js"></script>
  <script defer src="settings.js"></script>
  <script defer src="vendor/alpinejs/cdn.min.js"></script>
</head>
<body>
<!-- The Android app's settings: at the address of the computer's (the page's ⚙️ leads here) -->
<div class="app" x-data="settings">

  <header class="appbar">
    <a class="brand" href="./" @click.prevent="back()">
      <span class="back">←</span>
      <img class="brand-logo" src="logo-mark.webp" alt="" width="44" height="44">
      <span x-text="$t('admin.title')"></span>
    </a>
    <span class="save-pill" x-cloak x-show="form" :class="saveState">
      <span x-show="saveState === 'saved'" x-text="$t('admin.savedButton')"></span>
      <span x-show="saveState === 'pending' || saveState === 'saving'" x-text="$t('admin.saving')"></span>
      <span x-show="saveState === 'error'" x-text="$t('admin.notSaved')"></span>
    </span>
  </header>

  <div class="toast" x-cloak x-show="error" x-transition.opacity role="alert">
    <span x-text="error"></span>
    <button @click="error = ''" :aria-label="$t('common.close')">✕</button>
  </div>
  <div class="toast ok" x-cloak x-show="notice" x-transition.opacity role="status">
    <span x-text="notice"></span>
    <button @click="notice = ''" :aria-label="$t('common.close')">✕</button>
  </div>

  <main x-cloak x-show="form">
    <!-- On this phone (the default) or on the computer (the Anki add-on): what's below
         is for the phone's mode only; the computer's mode has its settings on the computer -->

    <!-- The licence: the relay's account -->
    <section class="panel" x-show="onPhone()">
      <h2 x-text="$t('android.licence.title')"></h2>
      <!-- A debug build: the real relay or the test one in one tap, each with its own licence -->
      <div class="chips" role="radiogroup" x-show="form?.relays?.test" :aria-label="$t('android.advanced.relay')">
        <button type="button" class="chip" role="radio" :aria-checked="form?.relay === form?.relays?.real"
                :class="{ active: form?.relay === form?.relays?.real }" @click="useRelay(form.relays.real)"
                x-text="$t('android.licence.realRelay')"></button>
        <button type="button" class="chip" role="radio" :aria-checked="form?.relay === form?.relays?.test"
                :class="{ active: form?.relay === form?.relays?.test }" @click="useRelay(form.relays.test)"
                x-text="$t('android.licence.testRelay')"></button>
      </div>
      <!-- The free trial, no card (once per phone): started by the first lesson, nothing to do -->
      <p class="hint" x-show="trial && form && !form.has_key" x-text="$t('android.subscription.trialAtFirstLesson')"></p>
      <!-- The subscription (Google Play): shown once it is on sale; a key can still be typed below -->
      <template x-if="offers.length">
        <div class="subscription">
          <!-- No key yet, the free trial's, or a subscription that ended: subscribing -->
          <template x-if="!form?.has_key || account?.plan === 'free_trial' || lapsed === 'relay.subscription_ended'">
            <div>
              <!-- A month, a year: one button each (the trial first when Google Play still offers it) -->
              <template x-for="(o, i) in offers" :key="o.plan">
                <button class="btn wide" :class="{ primary: i === 0 }" :disabled="buying" @click="subscribe(o.plan)"
                        x-text="o.trial_days
                          ? $t(o.plan === 'yearly' ? 'android.subscription.trial.yearly' : 'android.subscription.trial.monthly', { days: o.trial_days, price: o.price })
                          : $t(o.plan === 'yearly' ? 'android.subscription.subscribe.yearly' : 'android.subscription.subscribe.monthly', { price: o.price })"></button>
              </template>
              <button class="link-btn" :disabled="buying" @click="restore()" x-text="$t('android.subscription.restore')"></button>
            </div>
          </template>
          <button class="link-btn" x-show="account?.plan !== 'free_trial' && (account?.ends_at || lapsed)" @click="manage()" x-text="$t('android.subscription.manage')"></button>
        </div>
      </template>
      <p class="hint" x-show="form && !form.has_key && !offers.length && !trial" x-text="$t('android.licence.none')"></p>
      <!-- Free with the add-on: said where the question comes up -->
      <p class="hint" x-show="form && !form.has_key"><a href="#where" x-text="$t('android.licence.free')"></a></p>
      <p x-show="form?.has_key" x-text="$t('android.licence.keySet', { key: form?.key })"></p>
      <template x-if="account">
        <div>
          <p x-text="$t('android.licence.plan', { plan: account.plan })"></p>
          <p x-show="!lapsed" x-text="$t('android.licence.credits', { credits: account.credits_left, today: account.daily_left })"></p>
          <p class="hint" x-show="account.renews_at && !account.ends_at"
             x-text="$t('android.licence.renews', { date: formatDate(account.renews_at) })"></p>
          <p class="hint" x-show="account.ends_at && !lapsed"
             x-text="$t(account.plan === 'free_trial' ? 'android.subscription.trialUntil' : 'android.subscription.until', { date: formatDate(account.ends_at) })"></p>
          <!-- Ended, or on hold: what to do -->
          <p class="hint" x-show="lapsed" x-text="lapsedText()"></p>
        </div>
      </template>
      <form @submit.prevent="saveKey()">
        <label class="field"><span x-text="$t('android.licence.key')"></span>
          <input type="password" x-model="newKey" autocomplete="off" :placeholder="$t('android.licence.keyPlaceholder')">
        </label>
        <button class="btn primary" :disabled="checking" x-text="$t('android.licence.check')"></button>
      </form>
    </section>

    <!-- AnkiDroid: installed, allowed -->
    <section class="panel" x-show="onPhone()">
      <h2 x-text="$t('android.anki.title')"></h2>
      <template x-if="anki">
        <div>
          <p x-show="anki.installed && anki.permitted" x-text="$t('android.anki.ready')"></p>
          <div x-show="!anki.installed">
            <p x-text="$t('android.anki.missing')"></p>
            <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.ichi2.anki"
               x-text="$t('android.anki.install')"></a>
            <p class="hint" x-text="$t('android.anki.openOnce')"></p>
          </div>
          <div x-show="anki.installed && !anki.permitted">
            <p x-text="$t('android.anki.notAllowed')"></p>
            <button class="btn primary" @click="allowAnki()" x-text="$t('android.anki.allow')"></button>
          </div>
        </div>
      </template>
    </section>

    <!-- Where Notosaurus works: on this phone, or on the computer (first, in that mode:
         the others are hidden) -->
    <section class="panel" id="where">
      <h2 x-text="$t('android.where.title')"></h2>
      <div class="options">
        <label class="option" :class="{ active: onPhone() && !pairing }">
          <input type="radio" name="where" :checked="onPhone()" @change="choosePhone()">
          <strong x-text="$t('android.where.phone')"></strong>
          <small x-text="$t('android.where.phoneHint')"></small>
        </label>
        <label class="option" :class="{ active: !onPhone() || pairing }">
          <input type="radio" name="where" :checked="!onPhone()" @change="chooseComputer()">
          <strong x-text="$t('android.where.computer')"></strong>
          <small x-text="$t('android.where.computerHint')"></small>
        </label>
      </div>

      <!-- The computer in use (or known): its name, and changing it -->
      <p x-show="form?.computer && !pairing">
        <strong x-text="form?.computer_name || $t('android.where.someComputer')"></strong> ·
        <a href="#" @click.prevent="pairing = true" x-text="$t('android.where.change')"></a>
      </p>
      <p class="hint" x-show="!onPhone()" x-text="$t('android.where.computerSettings')"></p>

      <!-- Connecting one: its QR code, or (rarely) its address -->
      <div x-show="pairing">
        <button class="btn primary" :disabled="connecting" @click="scanComputer()" x-text="$t('android.computer.scan')"></button>
        <p class="hint" x-text="$t('android.computer.scanHint')"></p>
        <p class="hint" x-show="!typing">
          <a href="#" @click.prevent="typing = true" x-text="$t('android.where.typeAddress')"></a>
        </p>
        <form x-show="typing" @submit.prevent="connectComputer()">
          <label class="field"><span x-text="$t('android.computer.address')"></span>
            <!-- Text, not "url": "192.168.1.10:8000" (no http://) is fine, the app completes it -->
            <input type="text" inputmode="url" autocapitalize="off" spellcheck="false" x-model="computerAddress"
                   autocomplete="off" :placeholder="$t('android.computer.addressPlaceholder')">
          </label>
          <button class="btn soft" :disabled="connecting || !computerAddress.trim()" x-text="$t('android.computer.connect')"></button>
        </form>
      </div>
    </section>

    <!-- Standing instructions for the AI, as on the computer (no Anki profiles here) -->
    <section class="panel" x-show="onPhone()">
      <h2 x-text="$t('admin.instructions.title')"></h2>
      <p class="hint" x-text="$t('admin.instructions.hint')"></p>
      <label class="field">
        <textarea x-model="form.instructions" @input="scheduleSave()" rows="3" maxlength="4000"
                  :placeholder="$t('admin.instructions.generalPlaceholder')"></textarea>
      </label>
      <label class="switch field">
        <input type="checkbox" x-model="form.helps" @change="scheduleSave()">
        <span class="track"><span class="knob"></span></span>
        <span><span x-text="$t('admin.instructions.helps')"></span></span>
      </label>
    </section>

    <!-- The voice reading the backs (the relay's), as on the computer -->
    <section class="panel" x-show="onPhone()">
      <h2 x-text="$t('admin.voice.title')"></h2>
      <label class="field">
        <span x-text="$t('admin.voice.rate')"></span>
        <select x-model="form.tts_rate" @change="scheduleSave()">
          <option value="-25%" x-text="$t('admin.voice.slow')"></option>
          <option value="-10%" x-text="$t('admin.voice.slower')"></option>
          <option value="+0%" x-text="$t('admin.voice.normal')"></option>
        </select>
      </label>
      <!-- The voice chosen per language variety (voice-choice.js); none: the language's usual one -->
      <div class="field voice-choice" x-show="voiceList.length">
        <span x-text="$t('admin.voice.byLanguage')"></span>
        <template x-for="locale in Object.keys(form?.voices ?? {})" :key="locale">
          <div class="voice-row">
            <span class="voice-locale" x-text="localeName(locale)"></span>
            <select :aria-label="localeName(locale)" @change="setVoice(locale, $event.target.value); scheduleSave()">
              <template x-for="v in voicesOf(locale)" :key="v.voice">
                <option :value="v.voice" x-text="voiceLabel(v)" :selected="v.voice === form.voices[locale]"></option>
              </template>
            </select>
            <button type="button" class="icon-btn" @click="listenVoice(locale, form.voices[locale])"
                    :aria-label="$t('admin.voice.listen')" :title="$t('admin.voice.listen')">▶</button>
            <button type="button" class="icon-btn muted" @click="removeVoice(locale); scheduleSave()"
                    :aria-label="$t('common.delete')">✕</button>
          </div>
        </template>
        <select class="voice-add" @change="addVoice($event.target.value); $event.target.value = ''; scheduleSave()">
          <option value="" x-text="$t('admin.voice.add')"></option>
          <template x-for="locale in voiceLocales()" :key="locale">
            <option :value="locale" x-text="localeName(locale) + ' · ' + locale"></option>
          </template>
        </select>
        <small x-text="$t('admin.voice.byLanguageHint')"></small>
      </div>
    </section>

    <!-- Lessons kept on the phone -->
    <section class="panel" x-show="onPhone()">
      <h2 x-text="$t('android.data.title')"></h2>
      <p x-show="data" x-text="data && $t('android.data.size', {
           lessons: $t('common.count.lessons', { count: data.lessons }),
           size: (data.bytes / 1e6).toLocaleString($store.i18n.lang, { maximumFractionDigits: 1 }) })"></p>
      <button class="btn danger-soft" x-show="data?.lessons" @click="deleteLessons()"
              x-text="$t('android.data.deleteAll')"></button>
      <!-- The lessons in a file (LessonsTransfer): kept (Drive, the SD card…), or opened elsewhere -->
      <div class="admin-transfer">
        <h3 x-text="$t('admin.transfer.title')"></h3>
        <p class="hint" x-text="$t('android.transfer.hint')"></p>
        <div class="transfer-actions">
          <button type="button" class="btn primary" @click="exportLessons()" :disabled="transferring !== ''"
                  x-text="transferring === 'export' ? $t('admin.transfer.exporting') : $t('admin.transfer.export')"></button>
          <label class="btn soft" :class="{ disabled: transferring !== '' }">
            <span x-text="transferring === 'import' ? $t('admin.transfer.importing') : $t('admin.transfer.import')"></span>
            <input type="file" accept=".zip,application/zip" hidden :disabled="transferring !== ''" @change="importLessons($event)">
          </label>
        </div>
        <small class="muted" x-text="$t('admin.transfer.private')"></small>
      </div>
    </section>

    <section class="panel">
      <h2 x-text="$t('android.about.title')"></h2>
      <p x-text="$t('android.about.version', { version: form?.version })"></p>
      <!-- Free software: its code, its licence, its libraries' (as the computer's settings) -->
      <p x-text="$t('admin.about.free')"></p>
      <ul class="about-links">
        <li><a href="https://github.com/cchabanois/notosaurus" target="_blank" rel="noopener" x-text="$t('admin.about.source')"></a></li>
        <li><a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener" x-text="$t('admin.about.licence')"></a></li>
        <li><a :href="$docs('app-privacy')" target="_blank" rel="noopener" x-text="$t('admin.about.privacy')"></a></li>
        <li><a href="licences.html" x-text="$t('admin.about.libraries')"></a></li>
      </ul>
      <!-- A debug or staging build only (as the relays' chips): a release talks to the real relay -->
      <details x-show="onPhone() && form?.relays?.test">
        <summary x-text="$t('android.advanced.title')"></summary>
        <label class="field"><span x-text="$t('android.advanced.relay')"></span>
          <input type="url" x-model="form.relay" @change="saveNow()" autocomplete="off">
        </label>
        <p class="hint" x-text="$t('android.advanced.relayHint')"></p>
      </details>
    </section>

    <footer class="page-footer">
      <a class="docs-link" :href="$docs('')">📖 <span x-text="$t('common.help')"></span></a>
      <label class="lang-select">
        <span aria-hidden="true">🌐</span>
        <select :aria-label="$t('common.language')" :value="$store.i18n.choice"
                @change="setLanguage($event.target.value)">
          <option value="" :selected="!$store.i18n.choice"
                  x-text="$t('common.languageAuto', { name: $store.i18n.names[$store.i18n.auto] || $store.i18n.auto })"></option>
          <template x-for="code in $store.i18n.available" :key="code">
            <option :value="code" :selected="$store.i18n.choice === code" x-text="$store.i18n.names[code] || code"></option>
          </template>
        </select>
      </label>
    </footer>
  </main>

  <!-- A yes/no asked in the page (ask-confirm.js), above the sheet it comes from -->
  <div class="sheet-backdrop top" x-cloak x-show="asking.open" x-transition.opacity @click="answerConfirm(false)"></div>
  <aside class="sheet top" x-cloak x-show="asking.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="asking.open && answerConfirm(false)" role="alertdialog" aria-modal="true" :aria-label="asking.message">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="asking.message"></h2>
      <button class="icon-btn" @click="answerConfirm(false)" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-actions">
        <button type="button" class="btn soft" @click="answerConfirm(false)" x-text="asking.cancel"></button>
        <button type="button" class="btn danger-soft" @click="answerConfirm(true)" x-text="asking.ok"></button>
      </div>
    </div>
  </aside>

</div>
</body>
</html>
