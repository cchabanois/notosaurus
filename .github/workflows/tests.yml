name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - run: ruff format --check .

  types:
    # pyright, basic mode ([tool.pyright] in pyproject.toml): app/, notosaurus_core, the add-on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Into .venv, the one pyproject.toml names: pyright run as it is locally, no flag
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt pyright==1.1.414
      - run: .venv/bin/pyright

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.13: what users run (the add-on installs it with uv; the Docker image)
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          # the next version, to see breakages early
          - { os: ubuntu-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Check the page scripts parse
        shell: bash
        run: for f in static/*.js; do node --check "$f"; done
      - name: Unit-test the page scripts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: node --test tests/frontend/*.test.mjs  # files, not the folder: older Node can't take one

  docker:
    # The Docker image (README, "Or with Docker"): it builds, starts, and makes a
    # lesson with the demo AI, called from inside (a local call: no pairing).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t notosaurus .
      - run: docker run -d --name notosaurus -e NOTOSAURUS_LLM=fake notosaurus
      - name: Make a lesson
        run: |
          docker exec notosaurus python -c "
          import time, httpx
          for _ in range(30):
              try:
                  httpx.get('http://localhost:8000/api/lang')
                  break
              except httpx.TransportError:
                  time.sleep(1)
          r = httpx.post('http://localhost:8000/api/extract', data={'prompt': 'FR → ES'}, timeout=30)
          r.raise_for_status()
          assert r.json()['cards'], r.text
          print(len(r.json()['cards']), 'cards')
          "
      - if: failure()
        run: docker logs notosaurus

  real-anki:
    # The add-on's bridge and the .apkg import against Anki's real engine (the
    # `anki` package, no window), with the oldest and the newest supported Anki.
    name: anki (${{ matrix.anki }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        anki: ["25.2.7", "latest"]  # latest: requirements-anki.txt (kept up to date by Dependabot)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          if [ "${{ matrix.anki }}" = latest ]; then
            pip install -r requirements-anki.txt
          else
            pip install -r requirements-dev.txt "anki==${{ matrix.anki }}"
          fi
      - run: pytest -q tests/test_real_anki.py

  page:
    # The pages in a real browser (Playwright, headless Chromium): saving as they go,
    # generating again and undoing, deleting a lesson, the settings (tests/test_page.py).
    name: page (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-page.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_page.py

  addon-install:
    # The packaged add-on, unpacked as Anki would: downloads uv, installs Python
    # and the dependencies, starts the server (see tools/check_addon_install.py).
    name: addon install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"  # stands for Anki's Python, which runs the launcher
      - run: python tools/check_addon_install.py

  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python tools/build_addon.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notosaurus-addon
          path: dist/*.ankiaddon
          retention-days: 30
