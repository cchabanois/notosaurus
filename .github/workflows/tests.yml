name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The page the app shows: the public repository's static/
      - uses: actions/checkout@v7
        with:
          repository: cchabanois/notosaurus
          path: notosaurus
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Unit tests, then the app
        run: ./gradlew testDebugUnitTest assembleDebug -Pnotosaurus.web=../notosaurus/static
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
