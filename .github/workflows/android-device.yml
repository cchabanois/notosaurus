name: Android on a device

# The app's tests on an emulator (android/app/src/androidTest): AnkiDroid's real API,
# the whole app (WebView, page, LocalServer), its two modes. Slow (minutes): on the pull
# requests that change the app or its page, as the workflow "Android"; on demand (Actions →
# "Android on a device" → Run workflow); and once a week, AnkiDroid's new releases with it.
on:
  pull_request:
    paths: ["android/**", "static/**", ".github/workflows/android-device.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which AnkiDroids: on a pull request the one pinned (a new AnkiDroid never fails a pull
  # request that has nothing to do with it); on Mondays and on demand, its latest release
  # and older ones still on phones too (their API's surprises: what an older one refuses)
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ankidroid: ${{ steps.pick.outputs.ankidroid }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PINNED: "2.25.0"
          OLDER: '["2.24.1", "2.23.3"]'
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "ankidroid=[\"$PINNED\"]" >> "$GITHUB_OUTPUT"
          else
            latest=$(gh api repos/ankidroid/Anki-Android/releases/latest --jq '.tag_name | ltrimstr("v")')
            echo "ankidroid=$(jq -cn --arg latest "$latest" --arg pinned "$PINNED" --argjson older "$OLDER" '[$latest, $pinned] + $older | unique')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  emulator:
    needs: versions
    name: emulator (AnkiDroid ${{ matrix.ankidroid }})
    strategy:
      fail-fast: false # each version's result, not the first failure only
      matrix:
        ankidroid: ${{ fromJSON(needs.versions.outputs.ankidroid) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      # AnkiDroid as people get it (the "play" build: no all-files permission at start)
      - name: Download AnkiDroid ${{ matrix.ankidroid }}
        env:
          VERSION: ${{ matrix.ankidroid }}
        run: curl -sSfL -o ankidroid.apk "https://github.com/ankidroid/Anki-Android/releases/download/v$VERSION/dev-AnkiDroid-$VERSION-play-universal.apk"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          # Then the FreshInstall tests (PermissionTest) on their own, the app installed again (Gradle
          # removes it after a run): never granted AnkiDroid's permission, as revoking it would kill
          # the tests' process
          script: |
            adb install ../ankidroid.apk
            ./gradlew connectedDebugAndroidTest
            ./gradlew connectedDebugAndroidTest -Pnotosaurus.freshInstall
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports-ankidroid-${{ matrix.ankidroid }}
          path: android/app/build/reports/androidTests/
