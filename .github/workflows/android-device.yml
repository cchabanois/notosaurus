name: Android on a device

# The app's tests on an emulator (android/app/src/androidTest): AnkiDroid's real API,
# the whole app (WebView, page, LocalServer), its two modes. Slow (minutes), so on
# demand only: Actions → "Android on a device" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      # AnkiDroid as people get it (the "play" build: no all-files permission at start)
      - name: Download AnkiDroid
        run: curl -sSfL -o ankidroid.apk https://github.com/ankidroid/Anki-Android/releases/download/v2.25.0/dev-AnkiDroid-2.25.0-play-universal.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            adb install ../ankidroid.apk
            ./gradlew connectedDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: android/app/build/reports/androidTests/
