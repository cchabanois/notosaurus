name: Android on a device

# The app's tests on an emulator (android/app/src/androidTest): AnkiDroid's real API,
# the whole app (WebView, page, LocalServer), its two modes. Slow (minutes): on the pull
# requests that change the app or its page, as the workflow "Android"; on demand (Actions →
# "Android on a device" → Run workflow); and once a week, AnkiDroid's new releases with it.
on:
  pull_request:
    paths: ["android/**", "static/**", ".github/workflows/android-device.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      # AnkiDroid as people get it (the "play" build: no all-files permission at start)
      - name: Download AnkiDroid
        run: curl -sSfL -o ankidroid.apk https://github.com/ankidroid/Anki-Android/releases/download/v2.25.0/dev-AnkiDroid-2.25.0-play-universal.apk
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            adb install ../ankidroid.apk
            ./gradlew connectedDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports
          path: android/app/build/reports/androidTests/
