name: Android

# The Android app (android/): its tests and its build, with this revision's web page
# (static/, which it shows). Only when they change.
on:
  pull_request:
    paths: ["android/**", "static/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "static/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Unit tests (with their coverage), then the app
        run: ./gradlew createDebugUnitTestCoverageReport assembleDebug
      # The lines the unit tests run, per file: in the run's summary, the full report kept
      - name: Coverage
        run: |
          echo "### Android unit tests' coverage" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/coverage.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: android/app/build/reports/coverage/test/debug/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: android/app/build/reports/tests/
