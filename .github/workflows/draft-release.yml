name: Draft release

# After every merge on main, keep a draft GitHub release ready for the version
# in pyproject.toml: the Anki add-on built from main, the Android app for Google Play
# (its .aab, signed with the upload key), and the CHANGELOG.md notes.
# Publishing the draft on GitHub creates the tag v<version> on that commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # create and update the draft release

concurrency:
  group: draft-release
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ env.TAG }}
      version: ${{ env.VERSION }}
      published: ${{ env.PUBLISHED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Skip if this version is already published
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::notice::$TAG is already published: bump the version in pyproject.toml to prepare the next one."
            echo "PUBLISHED=1" >> "$GITHUB_ENV"
          fi
      - if: env.PUBLISHED != '1'
        run: python tools/changelog_section.py "$VERSION" > notes.md
      - if: env.PUBLISHED != '1'
        run: python tools/build_addon.py
      - name: Create or update the draft
        if: env.PUBLISHED != '1'
        run: |
          # A single draft: remove drafts left for other versions
          gh release list --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName' | while read -r other; do
            if [ "$other" != "$TAG" ]; then gh release delete "$other" --yes; fi
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "Notosaurus $VERSION" --notes-file notes.md
            gh release upload "$TAG" dist/*.ankiaddon --clobber
          else
            gh release create "$TAG" dist/*.ankiaddon --draft --target "$GITHUB_SHA" --title "Notosaurus $VERSION" --notes-file notes.md
          fi

  android:
    # The app for Google Play (Play Console takes it; Play App Signing then signs it with
    # the app's own key), signed with the upload key: the "release" environment's
    # secrets, which only main may use
    needs: draft
    if: needs.draft.outputs.published != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.draft.outputs.tag }}
      VERSION: ${{ needs.draft.outputs.version }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: The upload key, outside the checkout (app/build.gradle.kts reads it)
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}  # the .jks, in base64
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/upload-key"
          mkdir -m 700 "$dir"
          printf '%s' "$UPLOAD_KEYSTORE" | base64 -d > "$dir/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$dir/upload.jks" "$UPLOAD_KEYSTORE_PASSWORD" "$UPLOAD_KEYSTORE_PASSWORD" > "$dir/keystore.properties"
          echo "NOTOSAURUS_KEYSTORE_PROPERTIES=$dir/keystore.properties" >> "$GITHUB_ENV"
      - run: ./gradlew bundleRelease
      # An unsigned .aab (no secrets): never attached
      - name: Signed
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
      - name: Into the draft
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "notosaurus-$VERSION.aab"
          gh release upload "$TAG" "notosaurus-$VERSION.aab" --clobber
      - if: always()
        run: rm -rf "$RUNNER_TEMP/upload-key"
