name: Changelog

# After each merge on main: the pull request's changelog entries (the "## Changelog" of its
# description, which is the squash commit's message) put under Unreleased in CHANGELOG.md
# by tools/changelog_add.py, and pushed. No pull request touches CHANGELOG.md: two of them
# never conflict on it, and none is rebased, nor tested again, for a line of changelog.
#
# The push to main goes through the deploy key in CHANGELOG_DEPLOY_KEY (write access), listed
# in main's ruleset as a bypass actor ("Deploy keys"); see CONTRIBUTING.md, Pull requests.
# "[skip ci]" in the commit: no workflow runs for it, this one included.

on:
  push:
    branches: [main]
  # A merged pull request's entries added by hand (its push's run failed): its squash commit
  workflow_dispatch:
    inputs:
      sha:
        description: The merged pull request's squash commit on main
        required: true

permissions:
  contents: read

concurrency:
  group: changelog
  cancel-in-progress: false # merges in a row: each one's entries added in turn

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The entries of the commit merged, added on main as it is now (tools/changelog_push.sh:
      # fetched again, and done again if another merge's changelog lands meanwhile)
      - name: Add the merged pull request's entries, and push
        env:
          KEY_SET: ${{ secrets.CHANGELOG_DEPLOY_KEY != '' }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "CHANGELOG_DEPLOY_KEY is not set: nothing done (CONTRIBUTING.md, Pull requests)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/changelog_push.sh "$SHA"
