<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Other sites (fonts, CDN, links) never get this page's address: it may hold the pairing token -->
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#eaf3fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Notosaurus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="notosaurus-64.png" type="image/png" sizes="64x64">
  <!-- Home screen: phones want PNG (Chrome over plain HTTP makes a shortcut with these) -->
  <link rel="icon" href="notosaurus-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="notosaurus-touch-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- KaTeX: preview of the formulas (MathJax syntax, as Anki shows them) in the review -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script>
  <script defer src="i18n.js"></script>
  <script defer src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
<!-- A sheet open: the page behind doesn't scroll (a finger on the list would move it) -->
<div class="app" x-data="notosaurus" :class="{ 'has-bar': bottomBar() }"
     x-effect="document.documentElement.classList.toggle('sheet-open', sheetOpen())">

  <!-- App bar -->
  <header class="appbar">
    <div class="brand">
      <img class="brand-logo" src="logo-mark.webp" alt="" width="44" height="44">
      <span class="brand-text">
        <span class="brand-name">Notosaurus</span>
        <!-- Anki profile the lessons and cards go to -->
        <small class="brand-profile" x-cloak x-show="anki.available && profiles"
               :title="anki.profile ? $t('app.profile.open') : $t('app.profile.none')"
               x-text="'👤 ' + (anki.profile || $t('app.profile.noneShort'))"
               :class="{ none: !anki.profile }"></small>
      </span>
    </div>
    <div class="appbar-actions">
      <button class="chip-btn" @click="lessonQuery = ''; lessonsOpen = true" x-show="lessons.length" :aria-label="$t('app.lessonsButton')">
        <span aria-hidden="true">📚</span><span class="wide-only" x-text="$t('app.lessonsButton')"></span>
        <span class="count" x-text="visibleLessons().length"></span>
      </button>
      <button class="chip-btn" x-show="lessonId" @click="newLesson()"
              :aria-label="$t('app.newLesson')" :title="$t('app.newLessonHint')" x-text="$t('app.newLessonShort')"></button>
      <a class="chip-btn icon-only" href="admin.html" x-show="settingsHere"
         :aria-label="$t('app.settings')" :title="$t('app.settings')">⚙️</a>
      <!-- In the Android app, on the computer's page (whose settings stay on the computer): the app's own -->
      <a class="chip-btn icon-only" href="notosaurus-app:settings" x-cloak x-show="!settingsHere && inAndroidApp"
         :aria-label="$t('app.settings')" :title="$t('app.settings')">⚙️</a>
    </div>
  </header>

  <!-- Toasts -->
  <div class="toast" x-cloak x-show="error" x-transition.opacity role="alert">
    <span x-text="error"></span>
    <button @click="error = ''" :aria-label="$t('common.close')">✕</button>
    <!-- What to do about it, when there is something (the app: install AnkiDroid) -->
    <div class="toast-actions" x-show="errorAction.for === error">
      <button class="toast-action" x-show="errorAction.kind === 'installAnki'" @click="installAnki()"
              x-text="$t('android.anki.install')"></button>
    </div>
  </div>
  <div class="toast ok" x-cloak x-show="success && !error" x-transition.opacity role="status">
    <span x-text="success"></span>
    <button @click="success = ''" :aria-label="$t('common.close')">✕</button>
    <!-- After a send or an export: the lesson is done, review it (the app), start the next one -->
    <div class="toast-actions" x-show="successNext">
      <button class="toast-action" x-show="reviewInAnki && lessonExported" @click="reviewLesson()" x-text="$t('app.reviewInAnki')"></button>
      <button class="toast-action" @click="success = ''; newLesson()" x-text="$t('app.newLessonAction')"></button>
    </div>
  </div>

  <!-- A device that never scanned the QR code: how to get in -->
  <main x-cloak x-show="unpaired">
    <section class="panel pairing">
      <h2>📱 <span x-text="$t('app.pairing.title')"></span> <a class="help-link" :href="$docs('phone')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.pairing.title') })" :title="$t('common.helpOn', { topic: $t('app.pairing.title') })">?</a></h2>
      <p x-text="$t('errors.device.not_paired')"></p>
    </section>
  </main>

  <main x-show="!unpaired">
    <!-- The mascot, large, until a lesson is started -->
    <img class="hero-logo" x-show="!lessonId && !photos.length" src="logo.webp" alt="Notosaurus" width="511" height="465">
    <p class="tagline" x-show="!lessonId && !photos.length" x-text="$t('app.tagline')"></p>

    <!-- No AI service yet: the setup assistant (on the computer when it's the Anki add-on) -->
    <section class="panel setup-banner" x-cloak x-show="!configured">
      <h2>🦕 <span x-text="$t('app.setup.title')"></span></h2>
      <p x-text="$t('app.setup.hint')"></p>
      <a class="btn primary" href="setup.html" x-show="settingsHere" x-text="$t('app.setup.button')"></a>
      <p class="hint" x-show="!settingsHere" x-text="$t('app.setup.onComputer')"></p>
    </section>

    <!-- 1. Photos -->
    <section class="panel">
      <h2><span class="step">1</span> <span x-text="$t('app.photos.title')"></span> <a class="help-link" :href="$docs('photos')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.photos.title') })" :title="$t('common.helpOn', { topic: $t('app.photos.title') })">?</a></h2>
      <div class="strip">
        <template x-for="(p, i) in photos" :key="p.url">
          <figure class="thumb">
            <img :src="p.url" :alt="$t('app.photos.page', { n: i + 1 })" @click="openViewer(photos.map((x) => x.url), i)">
            <figcaption x-text="i + 1"></figcaption>
            <button class="thumb-remove" @click="removePhoto(i)" :aria-label="$t('app.photos.remove')">✕</button>
            <button class="thumb-rotate" x-show="!readOnly()" @click="rotatePhoto(i)" :disabled="loading"
                    :aria-label="$t('app.photos.rotate')">↻</button>
          </figure>
        </template>
        <div class="add-stack">
          <label class="add-tile primary">
            <span class="add-icon">📷</span>
            <span x-text="photos.length ? $t('app.photos.nextPage') : $t('app.photos.takePhoto')"></span>
            <input type="file" accept="image/*" capture="environment" hidden @change="addPhotos($event)">
          </label>
          <label class="add-tile">
            <span class="add-icon">🖼️</span>
            <span x-text="$t('app.photos.gallery')"></span>
            <input type="file" accept="image/*" multiple hidden @change="addPhotos($event)">
          </label>
          <!-- Its own picker: the gallery keeps the phone's photo picker -->
          <label class="add-tile" :class="{ busy: pdfBusy }">
            <span class="add-icon">📄</span>
            <span x-text="pdfBusy ? $t('app.pdf.reading') : $t('app.pdf.button')"></span>
            <input type="file" accept="application/pdf,.pdf" multiple hidden :disabled="pdfBusy" @change="addPhotos($event)">
          </label>
        </div>
      </div>
    </section>

    <!-- 2. Prompt -->
    <section class="panel">
      <h2><span class="step">2</span> <span x-text="$t('app.prompt.title')"></span> <a class="help-link" :href="$docs('instructions')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.prompt.title') })" :title="$t('common.helpOn', { topic: $t('app.prompt.title') })">?</a></h2>
      <div class="chips" role="radiogroup" :aria-label="$t('app.prompt.title')">
        <!-- A prompt written for this time only, never saved -->
        <button class="chip" role="radio" :aria-checked="selectedId === null" :class="{ active: selectedId === null }"
                @click="chooseFree()" x-text="$t('app.prompt.free')" :title="$t('app.prompt.freeHint')"></button>
        <template x-for="c in recentPrompts()" :key="c.id">
          <button class="chip" role="radio" :aria-checked="c.id === selectedId"
                  :class="{ active: c.id === selectedId }"
                  @click="choose(c.id)" x-text="(c.builtin ? '⭐ ' : '') + c.name"
                  :title="c.builtin ? $t('app.prompt.builtin') : ''"></button>
        </template>
        <button class="chip more" x-show="prompts.length > recentPrompts().length" @click="openPicker()">
          <span x-text="$t('app.prompt.all')"></span> <span class="count" x-text="prompts.length"></span>
        </button>
        <button class="chip add" @click="openEditor('new')" x-text="$t('app.prompt.new')" :title="$t('app.prompt.newHint')"></button>
      </div>
      <textarea x-model="form.text" rows="4" x-ref="promptText" :aria-label="$t('app.prompt.text')"
                :placeholder="selectedId === null ? $t('app.prompt.freePlaceholder') : ''"></textarea>
      <p class="hint" x-show="isModified()" x-text="$t('app.prompt.modified')"></p>
      <p class="hint" x-show="selectedId === null" x-text="$t('app.prompt.freeNote')"></p>

      <!-- Off by default: only then is the AI asked for them -->
      <label class="switch fun-facts">
        <input type="checkbox" x-model="funFacts">
        <span class="track"><span class="knob"></span></span>
        <span x-text="$t('app.prompt.funFacts')"></span>
      </label>
      <!-- Its default in the settings; changed here, kept on this device -->
      <label class="switch helps">
        <input type="checkbox" x-model="helps" @change="rememberHelps()">
        <span class="track"><span class="knob"></span></span>
        <span x-text="$t('app.prompt.helps')"></span>
      </label>
      <!-- Quick by default (a few seconds); careful for a rich lesson. Kept on this device -->
      <div class="speed" role="radiogroup" :aria-label="$t('app.prompt.speed')">
        <button type="button" class="chip" role="radio" :aria-checked="quick" :class="{ active: quick }"
                @click="quick = true" x-text="$t('app.prompt.quick')"></button>
        <button type="button" class="chip" role="radio" :aria-checked="!quick" :class="{ active: !quick }"
                @click="quick = false" x-text="$t('app.prompt.careful')"></button>
        <small class="hint" x-text="quick ? $t('app.prompt.quickHint') : $t('app.prompt.carefulHint')"></small>
      </div>

      <div class="prompt-actions">
        <button class="link-btn" x-show="selectedId" @click="openEditor('edit')" x-text="$t('app.prompt.edit')"></button>
        <button class="link-btn strong" x-show="canSaveAsNew()" @click="openEditor('copy')"
                x-text="$t('app.prompt.saveAsNew')"></button>
      </div>

      <button class="btn soft wide" x-show="cards.length" @click="extract()" :disabled="!canGenerate()">
        <span x-text="$t('app.prompt.regenerate')"></span>
        <small x-text="regeneratesInPlace() ? $t('app.prompt.regenerateHint') : $t('app.prompt.regenerateNewHint')"></small>
      </button>
      <p class="hint" x-show="cards.length && regeneratesInPlace() && lessonExported" x-text="$t('app.prompt.regenerateExported')"></p>

      <!-- No photo: the prompt alone (a word list, a topic…). Photos stay the main way. -->
      <div class="from-prompt" x-show="!cards.length && !photos.length">
        <button class="btn soft wide" @click="extract()" :disabled="!canGenerate()" x-text="$t('app.prompt.fromPrompt')"></button>
        <p class="hint" x-text="$t('app.prompt.fromPromptHint')"></p>
      </div>
    </section>

    <!-- 3. Review -->
    <section class="panel review" x-cloak x-show="cards.length" x-ref="review">
      <div class="review-head">
        <h2><span class="step">3</span> <span x-text="$t('app.review.title')"></span> <a class="help-link" :href="$docs('review')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.review.title') })" :title="$t('common.helpOn', { topic: $t('app.review.title') })">?</a></h2>
        <span class="save-pill" :class="saveState">
          <span x-show="saveState === 'saved'" x-text="$t('app.review.saved')"></span>
          <span x-show="saveState === 'pending' || saveState === 'saving'" x-text="$t('app.review.saving')"></span>
          <span x-show="saveState === 'error'" x-text="$t('app.review.notSaved')"></span>
        </span>
        <!-- The open lesson can be deleted here too (same confirmation as in the list) -->
        <button class="icon-btn muted" x-show="lessonId && !readOnly()" @click="deleteLesson({ id: lessonId, deck })"
                :aria-label="$t('app.lessons.delete')" :title="$t('app.lessons.delete')">🗑</button>
      </div>

      <label class="field deck">
        <span x-text="$t('app.review.deck')"></span>
        <input x-model="deck" :readonly="readOnly()" list="decks" @focus="loadDecks()">
      </label>
      <p class="hint ai-choice" x-show="lessonChoice" x-text="$t('app.review.choice', { choice: lessonChoice })"></p>
      <datalist id="decks">
        <template x-for="d in decks" :key="d"><option :value="d"></option></template>
      </datalist>
      <!-- The prompt this lesson was generated with (read-only; the prompt area above holds it too) -->
      <details class="lesson-prompt" x-show="lessonPrompt">
        <summary x-text="$t('app.review.promptUsed')"></summary>
        <p x-text="lessonPrompt"></p>
      </details>
      <!-- The Anki profile that created the lesson, and whether it shares it -->
      <div class="lesson-owner" x-show="lessonOwner">
        <span class="owner-name" x-html="$th('app.review.owner', { owner: lessonOwner })"></span>
        <label class="switch" :class="{ disabled: !canShare() }">
          <input type="checkbox" x-model="lessonShared" :disabled="!canShare()">
          <span class="track"><span class="knob"></span></span>
          <span x-text="$t('app.review.sharedSwitch')"></span>
        </label>
        <p class="hint" x-show="readOnly()" x-text="$t('app.review.readOnly', { owner: lessonOwner })"></p>
        <p class="warn" x-show="!lessonShared && anki.profile && anki.profile !== lessonOwner"
           x-text="$t('app.review.otherProfileOpen', { profile: anki.profile })"></p>
      </div>
      <p class="count-line" x-text="$t('common.count.cards', { count: cards.length })"></p>

      <form class="revise" x-show="!readOnly()" @submit.prevent="revise()">
        <textarea x-model="revision.text" rows="2" :aria-label="$t('app.revise.label')"
                  :placeholder="$t('app.revise.placeholder')"
                  @keydown.ctrl.enter.prevent="revise()" @keydown.meta.enter.prevent="revise()"></textarea>
        <button class="btn primary" :disabled="!revision.text.trim() || revision.busy" x-text="$t('app.revise.button')"></button>
      </form>
      <div class="revision-result" x-cloak x-show="revision.summary" x-transition.opacity>
        <div>
          <strong x-text="revision.summary"></strong>
          <small x-text="revision.stats"></small>
        </div>
        <button class="btn soft" x-show="revision.undo" @click="undoRevision()" x-text="$t('app.revise.undo')"></button>
        <button class="icon-btn muted" @click="clearRevision()" :aria-label="$t('common.close')">✕</button>
      </div>

      <!-- Just made quick: once more, carefully (a rich lesson: a figure, maths) -->
      <div class="careful-again" x-show="madeQuick && regeneratesInPlace()">
        <small class="hint" x-text="$t('app.review.madeQuick')"></small>
        <button class="btn soft" @click="extract({ careful: true })" :disabled="!canGenerate()"
                x-text="$t('app.review.carefulAgain')"></button>
      </div>

      <div class="diagram-hints" x-show="hasMasks()">
        <p class="hint" x-show="!readOnly()" x-text="$t('app.review.diagramHint')"></p>
        <p class="hint warn" x-show="diagramWarning" x-text="$t('app.review.diagramWarning')"></p>
      </div>

      <p class="hint" x-show="!readOnly() && cards.some((c) => isCloze(c.front))" x-text="$t('app.review.clozeHint')"></p>

      <div class="cards">
        <template x-for="card in cards" :key="card.key">
          <article class="flash" :class="{ changed: card._state, 'has-explain': card._explain?.open, 'has-diagram': card.mask, 'has-picture': card.picture || card.picture_prompt || card.figure || card._panel }">
            <!-- Diagram label: the photo with every label hidden, this card's mask highlighted and movable -->
            <template x-if="card.mask && photoFor(card)">
              <div class="diagram">
                <img :src="photoFor(card)" alt="" draggable="false">
                <div class="crop-frame" :style="maskStyle(cropFor(card))" :title="$t('app.review.cropFrame')">
                  <template x-for="corner in ['nw', 'ne', 'sw', 'se']" :key="corner">
                    <i class="crop-handle" :class="corner" x-show="!readOnly()"
                       @pointerdown.stop="startCrop($event, card, corner)"></i>
                  </template>
                </div>
                <template x-for="other in masksOnPage(card)" :key="other.key">
                  <div class="mask" :class="{ target: other === card, editable: other === card && !readOnly() }"
                       :style="maskStyle(other.mask)" @pointerdown="other === card && startDrag($event, card, 'move')">
                    <span x-text="'(' + other.mask.n + ')'"></span>
                    <i class="handle" x-show="other === card && !readOnly()"
                       @pointerdown.stop="startDrag($event, card, 'resize')"></i>
                  </div>
                </template>
              </div>
            </template>
            <!-- Picture card: the picture shows with the front text (or with the answer, below) -->
            <div class="card-picture" :class="{ figure: card.figure }" x-show="!card.picture_on_back && (card.picture || card._drawing || ((card.picture_prompt || card.figure) && drawing))">
              <img x-show="card.picture && !card._drawing" :src="card.picture && pictureUrl(card)" :alt="card.figure || card.picture_prompt"
                   @click="openViewer([pictureUrl(card)], 0)">
              <span class="drawing" x-show="!card.picture || card._drawing" x-text="$t('app.pictures.drawing')"></span>
            </div>
            <div class="flash-body">
              <span class="flash-badge" x-show="card._state"
                    x-text="card._state === 'new' ? $t('app.review.badgeNew') : $t('app.review.badgeModified')"></span>
              <textarea class="front" rows="1" x-model="card.front" :readonly="readOnly()" :placeholder="$t('app.review.front')" :aria-label="$t('app.review.front')"
                        x-init="watchHeight($el)" x-effect="card.front; fitHeight($el)"></textarea>
              <div class="math-preview" x-show="hasMath(card.front) || isCloze(card.front)" x-html="previewHtml(card.front)"></div>
              <!-- The back, the info, the wrong options and the "did you know" grow with their text,
                   as the front: a long answer is seen whole -->
              <textarea class="back" rows="1" x-model="card.back" :readonly="readOnly()" @keydown.enter.prevent
                        :placeholder="isCloze(card.front) ? $t('app.review.extra') : card.choices.length ? $t('app.review.rightChoice') : $t('app.review.back')"
                        :aria-label="card.choices.length ? $t('app.review.rightChoice') : $t('app.review.back')"
                        x-init="watchHeight($el)" x-effect="card.back; fitHeight($el)"></textarea>
              <div class="math-preview back" x-show="hasMath(card.back)" x-html="previewHtml(card.back)"></div>
              <!-- Multiple choice, true/false: the back is the right answer, these the wrong ones -->
              <div class="choices" x-show="card.choices.length">
                <template x-for="(choice, n) in card.choices" :key="n">
                  <div class="choice">
                    <span class="wrong" aria-hidden="true">✗</span>
                    <textarea class="grow" rows="1" x-model="card.choices[n]" :readonly="readOnly()" @keydown.enter.prevent
                              :placeholder="$t('app.review.wrongChoice')" :aria-label="$t('app.review.wrongChoice')"
                              x-init="watchHeight($el)" x-effect="card.choices[n]; fitHeight($el)"></textarea>
                    <button class="icon-btn muted" x-show="!readOnly() && card.choices.length > 1" @click="card.choices.splice(n, 1)"
                            :aria-label="$t('app.review.removeChoice')">✕</button>
                  </div>
                </template>
                <button class="link-btn" x-show="!readOnly()" @click="card.choices.push('')" x-text="$t('app.review.addChoice')"></button>
              </div>
              <!-- The picture belongs to the answer ("What is a tangent?"): shown under it, as in Anki -->
              <div class="card-picture on-back" :class="{ figure: card.figure }" x-show="card.picture_on_back && (card.picture || card._drawing || ((card.picture_prompt || card.figure) && drawing))">
                <img x-show="card.picture && !card._drawing" :src="card.picture && pictureUrl(card)" :alt="card.figure || card.picture_prompt"
                   @click="openViewer([pictureUrl(card)], 0)">
                <span class="drawing" x-show="!card.picture || card._drawing" x-text="$t('app.pictures.drawing')"></span>
              </div>
              <div class="meta">
                <textarea class="info" rows="1" x-model="card.info" :readonly="readOnly()" @keydown.enter.prevent
                          :placeholder="$t('app.review.info')" :aria-label="$t('app.review.infoLabel')"
                          x-init="watchHeight($el)" x-effect="card.info; fitHeight($el)"></textarea>
                <input class="subdeck" x-model="card.subdeck" :readonly="readOnly()" :placeholder="$t('app.review.subdeck')"
                       :aria-label="$t('app.review.subdeckLabel')"
                       list="subdecks" :size="Math.max(card.subdeck.length, 10)">
              </div>
              <!-- Shown under the info on the back, in Anki; cleared, it's gone -->
              <div class="fun-fact" x-show="card.fun_fact">
                <span aria-hidden="true">💡</span>
                <textarea class="grow" rows="1" x-model="card.fun_fact" :readonly="readOnly()" @keydown.enter.prevent
                          :aria-label="$t('app.review.funFact')"
                          x-init="watchHeight($el)" x-effect="card.fun_fact; fitHeight($el)"></textarea>
              </div>
              <!-- The helps written at generation: on the back in Anki; cleared, they're gone -->
              <div class="card-help" x-show="card.explanation">
                <span aria-hidden="true">💬</span>
                <textarea rows="2" x-model="card.explanation" :readonly="readOnly()" :aria-label="$t('app.review.explanation')"></textarea>
              </div>
              <div class="card-help" x-show="card.mnemonic">
                <span aria-hidden="true">🧠</span>
                <textarea rows="2" x-model="card.mnemonic" :readonly="readOnly()" :aria-label="$t('app.review.mnemonic')"></textarea>
              </div>
            </div>
            <div class="flash-actions">
              <button class="icon-btn" x-show="lessonId && card.front.trim() && (card.back.trim() || isCloze(card.front))"
                      @click="explain(card)" :class="{ active: card._explain?.open }" :aria-label="$t('app.explain.button')"
                      :title="$t('app.explain.button')">💬</button>
              <button class="icon-btn" x-show="hasAudio() && !hasMath(card.back) && !isCloze(card.front) && !card.choices.length" @click="play(card.back)" :aria-label="$t('app.review.listen')">🔊</button>
              <button class="icon-btn" x-show="!readOnly() && !card.mask && !isCloze(card.front) && lessonId" @click="togglePicturePanel(card)"
                      :class="{ active: card._panel }" :aria-label="$t('app.pictures.panel')">🖼️</button>
              <button class="icon-btn muted" x-show="!readOnly()" @click="removeCard(card)" :aria-label="$t('app.review.removeCard')">✕</button>
            </div>
            <!-- 💬 The card explained, on demand; then only the follow-ups the AI says would help -->
            <div class="explain" x-show="card._explain?.open">
              <template x-for="(block, b) in card._explain?.blocks ?? []" :key="b">
                <p class="explain-block">
                  <strong x-show="block.kind !== 'explain'" x-text="$t('app.explain.kinds.' + block.kind)"></strong>
                  <span x-text="block.text"></span>
                </p>
              </template>
              <p class="hint" x-show="card._explain?.loading" x-text="$t('app.explain.thinking')"></p>
              <p class="error-text" x-show="card._explain?.error" x-text="card._explain?.error"></p>
              <div class="explain-actions">
                <template x-for="k in card._explain?.more ?? []" :key="k">
                  <button class="chip" @click="explain(card, k)" :disabled="Boolean(card._explain?.loading)"
                          x-text="$t('app.explain.ask.' + k)"></button>
                </template>
                <button class="link-btn" x-show="!readOnly() && card._explain?.blocks.length && !card._explain?.kept"
                        @click="keepExplanation(card)" x-text="$t('app.explain.keep')"></button>
                <button class="icon-btn muted" @click="card._explain.open = false" :aria-label="$t('common.close')">✕</button>
              </div>
            </div>
            <!-- The card's picture: what to draw, redraw, own photo, none -->
            <div class="picture-panel" x-show="card._panel">
              <label class="field">
                <span x-text="card.figure ? $t('app.pictures.figure') : $t('app.pictures.subject')"></span>
                <input x-model="card._subject" :placeholder="card.figure ? $t('app.pictures.figurePlaceholder') : $t('app.pictures.subjectPlaceholder')"
                       @keydown.enter.prevent="redrawPicture(card)">
              </label>
              <label class="switch">
                <input type="checkbox" x-model="card.picture_on_back">
                <span class="track"><span class="knob"></span></span>
                <span x-text="$t('app.pictures.onBack')"></span>
              </label>
              <div class="picture-actions">
                <button type="button" class="btn soft" @click="redrawPicture(card)" :disabled="card._drawing || !card._subject?.trim()"
                        x-text="card.picture ? $t('app.pictures.redraw') : $t('app.pictures.draw')"></button>
                <label class="btn soft" :class="{ disabled: card._drawing }">
                  <span x-text="$t('app.pictures.photo')"></span>
                  <input type="file" accept="image/*" hidden :disabled="card._drawing" @change="uploadPicture(card, $event)">
                </label>
                <button type="button" class="btn danger-soft" x-show="card.picture" @click="removePicture(card)"
                        :disabled="card._drawing" x-text="$t('app.pictures.remove')"></button>
              </div>
              <small class="muted" x-text="card.figure ? $t('app.pictures.figureCost') : $t('app.pictures.cost')"></small>
            </div>
          </article>
        </template>
      </div>
      <datalist id="subdecks">
        <template x-for="s in subdecks()" :key="s"><option :value="s"></option></template>
      </datalist>

      <button class="btn dashed wide" x-show="!readOnly()" @click="addCard()" x-text="$t('app.review.addCard')"></button>

      <div class="export-options">
        <label class="switch" :class="{ disabled: readOnly() }">
          <input type="checkbox" x-model="reverse" :disabled="readOnly()">
          <span class="track"><span class="knob"></span></span>
          <span><span x-text="$t('app.review.reverse')"></span> <small x-text="$t('app.review.reverseHint')"></small></span>
        </label>
        <label class="switch" :class="{ disabled: readOnly() }">
          <input type="checkbox" x-model="typing" :disabled="readOnly()">
          <span class="track"><span class="knob"></span></span>
          <span><span x-text="$t('app.review.typing')"></span> <small x-text="$t('app.review.typingHint')"></small></span>
        </label>
        <label class="switch" :class="{ disabled: readOnly() || !voice }">
          <input type="checkbox" x-model="dictation" :disabled="readOnly() || !voice">
          <span class="track"><span class="knob"></span></span>
          <span><span x-text="$t('app.review.dictation')"></span>
            <small x-text="voice ? $t('app.review.dictationHint') : $t('app.review.dictationNoVoice')"></small></span>
        </label>
        <p class="hint" x-show="voice">
          <span x-show="hasAudio()" x-html="$th('app.review.voiceIncluded', { voice })"></span>
          <span x-show="!hasAudio()" x-html="$th('app.review.voiceDevice', { voice })"></span>
        </p>
      </div>
    </section>

    <!-- Language: automatic (Anki's or the browser's) or picked here, for this device -->
    <footer class="page-footer">
      <a class="docs-link" :href="$docs('')" target="_blank" rel="noopener">📖 <span x-text="$t('common.help')"></span></a>
      <!-- Not where Notosaurus is paid for already (the Android app's subscription) -->
      <a class="support-link" x-show="donations" href="https://ko-fi.com/notosaurus" target="_blank" rel="noopener">☕ <span x-text="$t('common.support')"></span></a>
      <label class="lang-select">
        <span aria-hidden="true">🌐</span>
        <select :aria-label="$t('common.language')" :value="$store.i18n.choice"
                @change="setLanguage($event.target.value)">
          <option value="" :selected="!$store.i18n.choice"
                  x-text="$t('common.languageAuto', { name: $store.i18n.names[$store.i18n.auto] || $store.i18n.auto })"></option>
          <template x-for="code in $store.i18n.available" :key="code">
            <option :value="code" :selected="$store.i18n.choice === code" x-text="$store.i18n.names[code] || code"></option>
          </template>
        </select>
      </label>
    </footer>
  </main>

  <!-- Bottom action bar -->
  <div class="bottom-bar" x-show="bottomBar()">
    <button class="btn primary wide" x-show="!cards.length" @click="extract()" :disabled="!photos.length || !canGenerate()"
            x-text="photos.length ? $t('app.actions.generate') : $t('app.actions.startWithPhoto')"></button>
    <div class="bar-row" x-show="cards.length">
      <!-- Anki reachable: send directly, keep the file as a secondary option -->
      <button class="btn soft" x-show="anki.available && apkg" @click="exportApkg()" :disabled="exporting || sending"
              :aria-label="$t('app.actions.downloadApkg')">⬇️ .apkg</button>
      <!-- Sent already (the app): reviewed in AnkiDroid from here -->
      <button class="btn soft" x-show="reviewInAnki && lessonExported" @click="reviewLesson()" :disabled="sending"
              x-text="$t('app.reviewInAnki')"></button>
      <button class="btn primary wide" x-show="anki.available" @click="sendToAnki()" :disabled="sending || exporting">
        <span x-text="sending ? $t('app.actions.sending') : $t('app.actions.addToAnki')"></span>
      </button>
      <button class="btn primary wide" x-show="!anki.available" @click="exportApkg()" :disabled="exporting">
        <span x-text="exporting ? $t('app.actions.exporting') : $t('app.actions.exportApkg')"></span>
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="overlay" x-cloak x-show="loading || revision.busy" x-transition.opacity>
    <div class="loading-card">
      <div class="spinner"></div>
      <strong x-text="revision.busy ? $t('app.loading.revising') : photos.length ? $t('app.loading.reading') : $t('app.loading.writing')"></strong>
      <small x-text="!revision.busy && loadingQuick ? $t('app.loading.durationQuick') : $t('app.loading.duration')"></small>
      <!-- The cards as the AI writes them: the last ones, while the others come -->
      <ul class="coming" x-show="loading && coming.length">
        <template x-for="(card, i) in coming.slice(-5)" :key="coming.length - 5 + i">
          <li><strong x-text="card.front"></strong> <span x-text="card.back"></span></li>
        </template>
      </ul>
      <button class="btn soft" x-show="loading && generating" @click="cancelGeneration()" :disabled="cancelling"
              x-text="cancelling ? $t('app.loading.cancelling') : $t('common.cancel')"></button>
    </div>
  </div>

  <!-- Lessons sheet -->
  <div class="sheet-backdrop" x-cloak x-show="lessonsOpen" x-transition.opacity @click="lessonsOpen = false"></div>
  <aside class="sheet" x-cloak x-show="lessonsOpen" x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="lessonsOpen = false" :aria-label="$t('app.lessons.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="$t('app.lessons.title')"></span> <a class="help-link" :href="$docs('lessons')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.lessons.title') })" :title="$t('common.helpOn', { topic: $t('app.lessons.title') })">?</a></h2>
      <button class="icon-btn" @click="lessonsOpen = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="profile-filter" x-show="anki.profile">
      <span x-html="$th('app.lessons.ankiProfile', { profile: anki.profile })"></span>
    </div>
    <input type="search" class="lesson-search" x-show="manyLessons()" x-model="lessonQuery"
           :placeholder="$t('app.lessons.search')" :aria-label="$t('app.lessons.search')">
    <!-- By subject (the deck's first level), the most recent first; see lessonSections() -->
    <div class="lesson-list">
      <p class="empty" x-show="!visibleLessons().length" x-text="$t('app.lessons.none')"></p>
      <template x-for="g in lessonSections()" :key="g.key">
        <section class="lesson-group">
          <h3>
            <button type="button" class="group-head" :disabled="!g.foldable" @click="toggleSubject(g)"
                    :aria-expanded="g.foldable ? String(g.open) : null">
              <span class="fold" x-show="g.foldable" x-text="g.open ? '▾' : '▸'" aria-hidden="true"></span>
              <span x-text="g.name"></span>
              <span class="count" x-show="g.count !== undefined" x-text="g.count"></span>
            </button>
          </h3>
          <p class="empty" x-show="g.key === 'found' && !g.count" x-text="$t('app.lessons.notFound')"></p>
          <ul x-show="g.open">
            <template x-for="l in g.lessons" :key="l.id">
              <li :class="{ current: l.id === lessonId }">
                <button class="lesson" @click="openLesson(l.id); lessonsOpen = false" :title="l.deck">
                  <strong x-text="l.title"></strong>
                  <small>
                    <span x-text="formatDate(l.updated_at)"></span> ·
                    <span x-text="$t('common.count.cards', { count: l.card_count })"></span>
                    <span x-show="l.owner && (!anki.profile || l.owner !== anki.profile)" x-text="' · 👤 ' + l.owner"></span>
                  </small>
                </button>
                <span class="badge shared" x-show="l.shared" x-text="$t('app.lessons.sharedBadge')"></span>
                <span class="badge" x-show="l.exported_at" x-text="$t('app.lessons.exported')"></span>
                <button class="icon-btn muted" x-show="canDelete(l)" @click="deleteLesson(l)" :aria-label="$t('app.lessons.delete')">🗑</button>
              </li>
            </template>
          </ul>
        </section>
      </template>
    </div>
  </aside>

  <!-- PDF page picker: more pages than places left -->
  <div class="sheet-backdrop" x-cloak x-show="pdf.open" x-transition.opacity @click="donePdfPicker(false)"></div>
  <aside class="sheet" x-cloak x-show="pdf.open" x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="pdf.open && donePdfPicker(false)" :aria-label="$t('app.pdf.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="$t('app.pdf.title')"></span> <a class="help-link" :href="$docs('photos')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.pdf.title') })" :title="$t('common.helpOn', { topic: $t('app.pdf.title') })">?</a></h2>
      <button class="icon-btn" @click="donePdfPicker(false)" :aria-label="$t('common.close')">✕</button>
    </div>
    <p class="hint" x-text="$t('app.pdf.hint', { name: pdf.name, count: pdf.pages.length, free: pdf.free })"></p>
    <div class="pdf-pages">
      <template x-for="p in pdf.pages" :key="p.n">
        <button type="button" class="pdf-page" :class="{ chosen: p.chosen }" :aria-pressed="String(p.chosen)"
                :disabled="!p.chosen && pdfChosen().length >= pdf.free" @click="p.chosen = !p.chosen"
                :aria-label="$t('app.photos.page', { n: p.n })">
          <img x-show="p.url" :src="p.url" alt="">
          <span class="pdf-page-n" x-text="p.n"></span>
        </button>
      </template>
    </div>
    <button class="btn primary wide" :disabled="!pdfChosen().length" @click="donePdfPicker(true)"
            x-text="$t('app.pdf.add', { count: pdfChosen().length, free: pdf.free })"></button>
  </aside>

  <!-- Prompt picker sheet -->
  <div class="sheet-backdrop" x-cloak x-show="picker.open" x-transition.opacity @click="picker.open = false"></div>
  <aside class="sheet" x-cloak x-show="picker.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="picker.open = false" :aria-label="$t('app.picker.label')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="$t('app.picker.title')"></span> <small class="muted" x-text="'(' + prompts.length + ')'"></small> <a class="help-link" :href="$docs('instructions')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.picker.title') })" :title="$t('common.helpOn', { topic: $t('app.picker.title') })">?</a></h2>
      <button class="icon-btn" @click="picker.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="picker-tools">
      <input type="search" x-model="picker.query" x-ref="pickerSearch" :placeholder="$t('app.picker.search')"
             @keydown.enter.prevent="filteredPrompts().length === 1 && choose(filteredPrompts()[0].id)">
      <button class="btn soft" @click="picker.open = false; openEditor('new')" x-text="$t('app.prompt.new')"></button>
    </div>
    <ul class="picker-list">
      <template x-for="c in filteredPrompts()" :key="c.id">
        <li>
          <button class="picker-item" :class="{ current: c.id === selectedId }" @click="choose(c.id)">
            <strong x-text="(c.builtin ? '⭐ ' : '') + c.name"></strong>
            <small x-text="c.text"></small>
          </button>
          <button class="icon-btn muted" @click="duplicatePrompt(c)" :aria-label="$t('app.picker.duplicate', { name: c.name })">⧉</button>
          <button class="icon-btn muted" x-show="!c.builtin" @click="deletePrompt(c)" :aria-label="$t('app.picker.delete', { name: c.name })">🗑</button>
        </li>
      </template>
      <li class="empty" x-show="!filteredPrompts().length" x-text="$t('app.picker.none')"></li>
    </ul>
  </aside>

  <!-- Prompt editor sheet -->
  <div class="sheet-backdrop" x-cloak x-show="editor.open" x-transition.opacity @click="editor.open = false"></div>
  <aside class="sheet" x-cloak x-show="editor.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="editor.open = false" :aria-label="$t('app.prompt.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="editor.builtin ? $t('app.editor.builtin') : editor.id ? $t('app.editor.edit') : $t('app.editor.new')"></span> <a class="help-link" :href="$docs('instructions')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.picker.title') })" :title="$t('common.helpOn', { topic: $t('app.picker.title') })">?</a></h2>
      <button class="icon-btn" @click="editor.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <form class="sheet-body" @submit.prevent="editor.builtin ? duplicatePrompt(editor) : saveEditor()">
      <p class="hint" x-show="editor.builtin" x-text="$t('app.editor.builtinHint')"></p>
      <label class="field">
        <span x-text="$t('app.editor.name')"></span>
        <input x-model="editor.name" x-ref="editorName" :placeholder="$t('app.editor.namePlaceholder')" required :disabled="editor.builtin">
      </label>
      <label class="field">
        <span x-text="$t('app.editor.text')"></span>
        <textarea x-model="editor.text" rows="5" required :placeholder="$t('app.editor.textPlaceholder')" :disabled="editor.builtin"></textarea>
      </label>
      <label class="field">
        <span><span x-text="$t('app.editor.deck')"></span> <small class="muted" x-text="$t('common.optional')"></small></span>
        <input x-model="editor.deck" :placeholder="$t('app.editor.deckPlaceholder')" :disabled="editor.builtin">
        <small x-text="$t('app.editor.deckHint')"></small>
      </label>
      <!-- Voice of the backs: none, automatic, or a chosen one -->
      <div class="field">
        <span x-text="$t('app.editor.voice')"></span>
        <div class="chips" role="radiogroup" :aria-label="$t('app.editor.voice')">
          <template x-for="mode in ['none', 'auto', 'pick']" :key="mode">
            <button type="button" class="chip" role="radio" :aria-checked="editor.voiceMode === mode"
                    :class="{ active: editor.voiceMode === mode }" :disabled="editor.builtin"
                    @click="setVoiceMode(mode)" x-text="$t(`app.editor.voiceMode.${mode}`)"></button>
          </template>
        </div>
        <div class="with-action" x-show="editor.voiceMode === 'pick'">
          <input x-model="editor.voice" placeholder="en-GB-SoniaNeural" list="voices" :disabled="editor.builtin"
                 :aria-label="$t('app.editor.voice')">
          <button type="button" class="icon-btn" x-show="isVoice(editor.voice)"
                  @click="play(sampleText(editor.voice), editor.voice)" :aria-label="$t('app.editor.listenVoice')">▶</button>
        </div>
        <small x-text="$t(`app.editor.voiceModeHint.${editor.voiceMode}`)"></small>
      </div>
      <datalist id="voices">
        <template x-for="v in voices" :key="v.voice">
          <option :value="v.voice"
                  x-text="v.locale + ' · ' + (v.gender === 'Female' ? $t('app.editor.female') : $t('app.editor.male'))"></option>
        </template>
      </datalist>
      <div class="field">
        <span x-text="$t('app.editor.options')"></span>
        <label class="switch" :class="{ disabled: editor.builtin }">
          <input type="checkbox" x-model="editor.typing" :disabled="editor.builtin">
          <span class="track"><span class="knob"></span></span>
          <span><span x-text="$t('app.review.typing')"></span> <small x-text="$t('app.review.typingHint')"></small></span>
        </label>
        <label class="switch" :class="{ disabled: editor.builtin || editor.voiceMode === 'none' }">
          <input type="checkbox" x-model="editor.dictation" :disabled="editor.builtin || editor.voiceMode === 'none'">
          <span class="track"><span class="knob"></span></span>
          <span><span x-text="$t('app.review.dictation')"></span>
            <small x-text="editor.voiceMode !== 'none' ? $t('app.review.dictationHint') : $t('app.review.dictationNoVoice')"></small></span>
        </label>
      </div>
      <p class="hint error-text" x-show="editor.error" x-text="editor.error"></p>
      <div class="sheet-actions">
        <button type="button" class="btn danger-soft" x-show="editor.id && !editor.builtin" @click="deletePrompt()"
                x-text="$t('common.delete')"></button>
        <button type="button" class="btn soft" x-show="editor.id && !editor.builtin" @click="duplicatePrompt(editor)"
                x-text="$t('app.editor.duplicate')"></button>
        <button type="submit" class="btn primary"
                x-text="editor.builtin ? $t('app.editor.duplicateToChange') : editor.id ? $t('common.save') : $t('app.editor.create')"></button>
      </div>
    </form>
  </aside>

  <!-- A photo (or a card's picture) in full: ‹ › or a swipe between pages, a tap on it for its real size -->
  <div class="viewer" x-cloak x-show="viewer.open" x-transition.opacity role="dialog" :aria-label="$t('app.viewer.label')"
       @keydown.escape.window="viewer.open = false" @keydown.arrow-left.window="viewer.open && moveViewer(-1)"
       @keydown.arrow-right.window="viewer.open && moveViewer(1)" @click.self="viewer.open = false"
       @touchstart="viewer.touchX = $event.touches[0].clientX"
       @touchend="if (!viewer.zoomed) swipeViewer($event.changedTouches[0].clientX)">
    <div class="viewer-frame" :class="{ zoomed: viewer.zoomed }" @click.self="viewer.open = false">
      <img :src="viewer.list[viewer.index]" :alt="$t('app.photos.page', { n: viewer.index + 1 })"
           @click="viewer.zoomed = !viewer.zoomed">
    </div>
    <button class="viewer-close" @click="viewer.open = false" :aria-label="$t('common.close')">✕</button>
    <template x-if="viewer.list.length > 1">
      <div>
        <button class="viewer-nav prev" @click="moveViewer(-1)" :aria-label="$t('app.viewer.previous')">‹</button>
        <button class="viewer-nav next" @click="moveViewer(1)" :aria-label="$t('app.viewer.next')">›</button>
        <span class="viewer-count" x-text="`${viewer.index + 1} / ${viewer.list.length}`"></span>
      </div>
    </template>
  </div>

  <!-- Deleting a lesson: its cards in Anki too? (asked, never by default) -->
  <div class="sheet-backdrop top" x-cloak x-show="removal.open" x-transition.opacity @click="removal.open = false"></div>
  <aside class="sheet top" x-cloak x-show="removal.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="removal.open = false" :aria-label="$t('app.lessons.delete')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="$t('app.lessons.confirmDelete', { deck: removal.lesson?.deck ?? '' })"></h2>
      <button class="icon-btn" @click="removal.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body">
      <p class="hint" x-show="removal.checking" x-text="$t('app.lessons.checkingAnki')"></p>
      <label class="switch" x-show="!removal.checking && removal.count">
        <input type="checkbox" x-model="removal.anki">
        <span class="track"><span class="knob"></span></span>
        <span><span x-text="$t('app.lessons.alsoAnki', { count: removal.count })"></span>
          <small x-text="$t('app.lessons.alsoAnkiHint')"></small></span>
      </label>
      <p class="hint" x-show="!removal.checking && !removal.available" x-text="$t('app.lessons.ankiClosed')"></p>
      <div class="sheet-actions">
        <button type="button" class="btn soft" @click="removal.open = false" x-text="$t('common.cancel')"></button>
        <button type="button" class="btn danger-soft" @click="confirmDeleteLesson()" :disabled="removal.busy || removal.checking"
                x-text="removal.anki ? $t('app.lessons.deleteBoth', { count: removal.count }) : $t('app.lessons.deleteLesson')"></button>
      </div>
    </div>
  </aside>

</div>
</body>
</html>
