         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="leftovers.open = false" :aria-label="$t('app.leftovers.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="$t('app.leftovers.title')"></h2>
      <button class="icon-btn" @click="leftovers.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body">
      <p x-text="$t('app.leftovers.text', { count: leftovers.notes.length })"></p>
      <ul class="leftovers">
        <template x-for="n in leftovers.notes.slice(0, 8)" :key="n.id"><li x-text="n.text"></li></template>
        <li x-show="leftovers.notes.length > 8" x-text="$t('app.leftovers.more', { count: leftovers.notes.length - 8 })"></li>
      </ul>
      <p class="hint" x-text="$t('app.leftovers.hint')"></p>
      <div class="sheet-actions">
        <button type="button" class="btn soft" @click="leftovers.open = false" x-text="$t('app.leftovers.keep')"></button>
        <button type="button" class="btn danger-soft" @click="deleteLeftovers()" :disabled="leftovers.busy"
                x-text="$t('app.leftovers.delete', { count: leftovers.notes.length })"></button>
      </div>
    </div>
  </aside>

  <!-- A yes/no asked in the page (ask-confirm.js), above the sheet it comes from -->
  <div class="sheet-backdrop top" x-cloak x-show="asking.open" x-transition.opacity @click="answerConfirm(false)"></div>
  <aside class="sheet top" x-cloak x-show="asking.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="asking.open && answerConfirm(false)" role="alertdialog" aria-modal="true" :aria-label="asking.message">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="asking.message"></h2>
      <button class="icon-btn" @click="answerConfirm(false)" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-actions">
        <button type="button" class="btn soft" @click="answerConfirm(false)" x-text="asking.cancel"></button>
        <button type="button" class="btn danger-soft" @click="answerConfirm(true)" x-text="asking.ok"></button>
      </div>
    </div>
  </aside>

  <!-- Deleting a lesson: its cards in Anki too? (asked, never by default) -->
  <div class="sheet-backdrop top" x-cloak x-show="removal.open" x-transition.opacity @click="removal.open = false"></div>
  <aside class="sheet top" x-cloak x-show="removal.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="removal.open = false" :aria-label="$t('app.lessons.delete')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="$t('app.lessons.confirmDelete', { deck: removal.lesson?.deck ?? '' })"></h2>
      <button class="icon-btn" @click="removal.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body">
      <p class="hint" x-show="removal.checking" x-text="$t('app.lessons.checkingAnki')"></p>
      <label class="switch" x-show="!removal.checking && removal.count">
        <input type="checkbox" x-model="removal.anki">
        <span class="track"><span class="knob"></span></span>
        <span><span x-text="$t('app.lessons.alsoAnki', { count: removal.count })"></span>
          <small x-text="$t('app.lessons.alsoAnkiHint')"></small></span>
      </label>
      <p class="hint" x-show="!removal.checking && !removal.available" x-text="$t('app.lessons.ankiClosed')"></p>
      <div class="sheet-actions">
        <button type="button" class="btn soft" @click="removal.open = false" x-text="$t('common.cancel')"></button>
        <button type="button" class="btn danger-soft" @click="confirmDeleteLesson()" :disabled="removal.busy || removal.checking"
                x-text="removal.anki ? $t('app.lessons.deleteBoth', { count: removal.count }) : $t('app.lessons.deleteLesson')"></button>
      </div>
    </div>
  </aside>

</div>
</body>
</html>
