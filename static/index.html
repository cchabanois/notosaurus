<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Other sites (fonts, CDN, links) never get this page's address: it may hold the pairing token -->
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#eaf3fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Notosaurus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="notosaurus-64.png" type="image/png" sizes="64x64">
  <!-- Home screen: phones want PNG (Chrome over plain HTTP makes a shortcut with these) -->
  <link rel="icon" href="notosaurus-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="notosaurus-touch-180.png">
  <link rel="stylesheet" href="style.css">
  <!-- KaTeX: preview of the formulas (MathJax syntax, as Anki shows them) in the review -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="i18n.js"></script>
  <script defer src="app-photos.js"></script>
  <script defer src="app-prompts.js"></script>
  <script defer src="app-lessons.js"></script>
  <script defer src="app-cards.js"></script>
  <script defer src="app-revision.js"></script>
  <script defer src="app-diagram.js"></script>
  <script defer src="app-pictures.js"></script>
  <script defer src="app-anki.js"></script>
  <script defer src="app-dictation.js"></script>
  <script defer src="app-children.js"></script>
  <script defer src="app-exams.js"></script>
  <script defer src="app-report.js"></script>
  <script defer src="ask-confirm.js"></script>
  <script defer src="app.js"></script>
  <script defer src="vendor/alpinejs/cdn.min.js"></script>
</head>
<body>
<!-- A sheet open: the page behind doesn't scroll (a finger on the list would move it) -->
<div class="app" x-data="notosaurus"
     @dragover.window="ignoreDrop($event)" @drop.window="ignoreDrop($event)" :class="{ 'has-bar': bottomBar() }"
     x-effect="document.documentElement.classList.toggle('sheet-open', sheetOpen())">

  <!-- App bar -->
  <header class="appbar" :class="{ 'in-lesson': lessonId }">
    <div class="brand">
      <img class="brand-logo" src="logo-mark.webp" alt="" width="44" height="44">
      <span class="brand-text">
        <span class="brand-name">Notosaurus</span>
        <!-- Anki profile the lessons and cards go to: the one place a profile is always shown -->
        <small class="brand-profile" x-cloak x-show="profileShown()"
               :title="anki.profile ? $t('app.profile.open') : $t('app.profile.none')"
               x-text="'👤 ' + (anki.profile || $t('app.profile.noneShort'))"
               :class="{ none: !anki.profile }"></small>
      </span>
    </div>
    <div class="appbar-actions">
      <button class="chip-btn" @click="lessonQuery = ''; lessonsOpen = true" x-show="lessons.length" :aria-label="$t('app.lessonsButton')">
        <span aria-hidden="true">📚</span><span class="wide-only" x-text="$t('app.lessonsButton')"></span>
        <span class="count" x-text="visibleLessons().length"></span>
      </button>
      <!-- The app: AnkiDroid, one tap away (the cards are revised there) -->
      <button class="chip-btn icon-only" x-cloak x-show="reviewInAnki" @click="openAnkiDroid()"
              :aria-label="$t('app.openAnkiDroid')" :title="$t('app.openAnkiDroid')">
        <img class="anki-icon" x-show="ankiIcon" :src="ankiIcon" alt=""><span x-show="!ankiIcon" aria-hidden="true">🎓</span>
      </button>
      <!-- The child the next lesson is for (app-children.js): its card, the others -->
      <button class="chip-btn" @click="openChildren()" :aria-label="$t('app.children.title')" :title="$t('app.children.title')">
        <!-- A lesson open on a narrow screen: the icons alone (the lesson says whose it is below) -->
        <span aria-hidden="true">🧒</span><span class="wide-or-home" x-text="currentChild()?.name ?? $t('app.children.who')"></span>
      </button>
      <button class="chip-btn" x-show="lessonId" @click="newLesson()"
              :aria-label="$t('app.newLesson')" :title="$t('app.newLessonHint')">
        <span aria-hidden="true">＋</span><span class="wide-or-home" x-text="$t('app.newLessonShort').replace(/^＋\s*/, '')"></span>
      </button>
      <a class="chip-btn icon-only" href="admin.html" x-show="settingsHere"
         :aria-label="$t('app.settings')" :title="$t('app.settings')">⚙️</a>
      <!-- In the Android app, on the computer's page (whose settings stay on the computer): the app's own -->
      <a class="chip-btn icon-only" href="notosaurus-app:settings" x-cloak x-show="!settingsHere && inAndroidApp"
         :aria-label="$t('app.settings')" :title="$t('app.settings')">⚙️</a>
    </div>
  </header>

  <!-- Toasts -->
  <div class="toast" x-cloak x-show="error" x-transition.opacity role="alert">
    <span x-text="error"></span>
    <button @click="error = ''" :aria-label="$t('common.close')">✕</button>
    <!-- What to do about it, when there is something (the app: install AnkiDroid) -->
    <div class="toast-actions" x-show="errorAction.for === error">
      <button class="toast-action" x-show="errorAction.kind === 'installAnki'" @click="installAnki()"
              x-text="$t('android.anki.install')"></button>
      <a class="toast-action" x-show="errorAction.kind === 'subscribe'" href="admin.html"
         x-text="$t('android.subscription.subscribeShort')"></a>
    </div>
  </div>
  <div class="toast ok" x-cloak x-show="success && !error" x-transition.opacity role="status">
    <span x-text="success"></span>
    <button @click="success = ''" :aria-label="$t('common.close')">✕</button>
    <!-- After a send or an export: the lesson is done, review it (the app), start the next one -->
    <div class="toast-actions" x-show="successNext">
      <button class="toast-action" x-show="reviewInAnki && lessonExported" @click="reviewLesson()" x-text="$t('app.reviewInAnki')"></button>
      <button class="toast-action" @click="success = ''; newLesson()" x-text="$t('app.newLessonAction')"></button>
    </div>
  </div>

  <!-- A device that never scanned the QR code: how to get in -->
  <main x-cloak x-show="unpaired">
    <section class="panel pairing">
      <h2>📱 <span x-text="$t('app.pairing.title')"></span> <a class="help-link" :href="$docs('phone')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.pairing.title') })" :title="$t('common.helpOn', { topic: $t('app.pairing.title') })">?</a></h2>
      <p x-text="$t('errors.device.not_paired')"></p>
    </section>
  </main>

  <main x-show="!unpaired">
    <!-- What the service tells every user for now (the Android app: set on the relay) -->
    <div class="notice-bar" :class="switches.notice?.level" x-cloak x-show="switches.notice && noticeClosed !== switches.notice.id"
         role="status">
      <span x-text="switches.notice?.text"></span>
      <button class="icon-btn" @click="closeNotice()" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="notice-bar" x-cloak x-show="switches.update" role="status">
      <span x-text="$t('app.update.available')"></span>
      <a class="btn soft" :href="switches.store" target="_blank" rel="noopener" x-text="$t('app.update.open')"></a>
    </div>
    <!-- What Notosaurus does, until a lesson is started (the mascot: the header's logo only) -->
    <p class="tagline" x-show="!lessonId && !photos.length" x-text="$t('app.tagline')"></p>

    <!-- No AI service yet: the setup assistant (on the computer when it's the Anki add-on) -->
    <section class="panel setup-banner" x-cloak x-show="!configured">
      <h2>🦕 <span x-text="$t('app.setup.title')"></span></h2>
      <p x-text="$t('app.setup.hint')"></p>
      <a class="btn primary" href="setup.html" x-show="settingsHere" x-text="$t('app.setup.button')"></a>
      <p class="hint" x-show="!settingsHere" x-text="$t('app.setup.onComputer')"></p>
    </section>

    <!-- 1. Photos -->
    <section class="panel">
      <h2><span class="step">1</span> <span x-text="$t('app.photos.title')"></span> <a class="help-link" :href="$docs('photos')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.photos.title') })" :title="$t('common.helpOn', { topic: $t('app.photos.title') })">?</a></h2>
      <div class="strip">
        <template x-for="(p, i) in photos" :key="p.url">
          <figure class="thumb">
            <img :src="p.url" :alt="$t('app.photos.page', { n: i + 1 })" @click="openViewer(photos.map((x) => x.url), i)">
            <figcaption x-text="i + 1"></figcaption>
            <button class="thumb-remove" @click="removePhoto(i)" :aria-label="$t('app.photos.remove')">✕</button>
            <button class="thumb-rotate" x-show="!readOnly()" @click="rotatePhoto(i)" :disabled="loading"
                    :aria-label="$t('app.photos.rotate')">↻</button>
            <!-- Before it is sent: a name blacked out (sent photos: already read by the AI) -->
            <button class="thumb-hide" :class="{ used: p.mask }" x-show="!readOnly() && !p.sent" @click="openHide(i)"
                    :disabled="loading" :aria-label="$t('app.photos.hide')" :title="$t('app.photos.hide')">🖍️</button>
          </figure>
        </template>
        <div class="add-stack">
          <label class="add-tile primary">
            <span class="add-icon">📷</span>
            <span x-text="photos.length ? $t('app.photos.nextPage') : $t('app.photos.takePhoto')"></span>
            <input type="file" accept="image/*" capture="environment" hidden x-ref="camera" @change="addPhotos($event)">
          </label>
          <label class="add-tile" :class="{ dropping: dropTile === 'gallery' }" @dragover="dragOver($event, 'gallery')"
                 @dragleave="dropTile = ''" @drop="dropFiles($event)">
            <span class="add-icon">🖼️</span>
            <span x-text="$t('app.photos.gallery')"></span>
            <input type="file" accept="image/*" multiple hidden @change="addPhotos($event)">
          </label>
          <!-- Its own picker: the gallery keeps the phone's photo picker -->
          <label class="add-tile" :class="{ busy: pdfBusy, dropping: dropTile === 'pdf' }" @dragover="dragOver($event, 'pdf')"
                 @dragleave="dropTile = ''" @drop="dropFiles($event)">
            <span class="add-icon">📄</span>
            <span x-text="pdfBusy ? $t('app.pdf.reading') : $t('app.pdf.button')"></span>
            <input type="file" accept="application/pdf,.pdf" multiple hidden :disabled="pdfBusy" @change="addPhotos($event)">
          </label>
        </div>
      </div>
    </section>

    <!-- 2. Prompt -->
    <section class="panel">
      <h2><span class="step">2</span> <span x-text="$t('app.prompt.title')"></span> <a class="help-link" :href="$docs('instructions')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.prompt.title') })" :title="$t('common.helpOn', { topic: $t('app.prompt.title') })">?</a></h2>
      <div class="chips" role="radiogroup" :aria-label="$t('app.prompt.title')">
        <!-- A prompt written for this time only, never saved -->
        <button class="chip" role="radio" :aria-checked="selectedId === null" :class="{ active: selectedId === null }"
                @click="chooseFree()" x-text="$t('app.prompt.free')" :title="$t('app.prompt.freeHint')"></button>
        <template x-for="c in recentPrompts()" :key="c.id">
          <button class="chip" role="radio" :aria-checked="c.id === selectedId"
                  :class="{ active: c.id === selectedId }"
                  @click="choose(c.id)" x-text="(c.builtin ? '⭐ ' : '') + c.name"
                  :title="c.builtin ? $t('app.prompt.builtin') : ''"></button>
        </template>
        <button class="chip more" x-show="prompts.length > recentPrompts().length" @click="openPicker()">
          <span x-text="$t('app.prompt.all')"></span> <span class="count" x-text="prompts.length"></span>
        </button>
        <button class="chip add" @click="openEditor('new')" x-text="$t('app.prompt.new')" :title="$t('app.prompt.newHint')"></button>
      </div>
      <div class="dictated" :class="{ 'with-mic': mic.available }">
        <textarea x-model="form.text" rows="4" x-ref="promptText" :aria-label="$t('app.prompt.text')"
                  :disabled="dictating('prompt') || tidy.busy"
                  :placeholder="selectedId === null ? $t('app.prompt.freePlaceholder') : ''"></textarea>
        <button type="button" class="mic" x-show="mic.available" x-cloak
                :class="{ listening: mic.listening === 'prompt', busy: mic.busy === 'prompt' }"
                :disabled="mic.busy !== '' || (mic.listening !== '' && mic.listening !== 'prompt')"
                @click="dictate('prompt')" :aria-label="$t(micKey('prompt'))" :title="$t(micKey('prompt'))"
                x-text="mic.listening === 'prompt' ? '⏹' : mic.busy === 'prompt' ? '…' : '🎤'"></button>
      </div>
      <p class="hint" x-cloak x-show="dictationStep('prompt')" x-text="$t(dictationStep('prompt') || 'app.mic.busy')"></p>
      <div class="prompt-actions tidy" x-show="canTidy() || canUntidy()">
        <button type="button" class="link-btn strong" :disabled="tidy.busy" @click="tidyPrompt()"
                x-text="tidy.busy ? $t('app.prompt.tidyBusy') : $t('app.prompt.tidy')"></button>
        <button type="button" class="link-btn" x-cloak x-show="canUntidy()" @click="untidyPrompt()"
                x-text="$t('app.prompt.tidyUndo')"></button>
      </div>
      <p class="hint" x-show="isModified()" x-text="$t('app.prompt.modified')"></p>
      <p class="hint" x-show="selectedId === null" x-text="$t('app.prompt.freeNote')"></p>

      <!-- Quick by default (a few seconds); careful for a rich lesson. Kept on this device -->
      <div class="speed" role="radiogroup" :aria-label="$t('app.prompt.speed')">
        <button type="button" class="chip" role="radio" :aria-checked="quick" :class="{ active: quick }"
                @click="quick = true" x-text="$t('app.prompt.quick')"></button>
        <button type="button" class="chip" role="radio" :aria-checked="!quick" :class="{ active: !quick }"
                @click="quick = false" x-text="$t('app.prompt.careful')"></button>
        <small class="hint" x-text="quick ? $t('app.prompt.quickHint') : $t('app.prompt.carefulHint')"></small>
      </div>

      <div class="prompt-actions">
        <button class="link-btn" x-show="selectedId" @click="openEditor('edit')" x-text="$t('app.prompt.edit')"></button>
        <button class="link-btn strong" x-show="canSaveAsNew()" @click="openEditor('copy')"
                x-text="$t('app.prompt.saveAsNew')"></button>
      </div>

      <!-- The lesson's next pages, added days later: only they are read, its cards stay -->
      <button class="btn primary wide" x-show="canComplete()" @click="extract({ complete: true })" :disabled="!canGenerate()">
        <span x-text="$t('app.prompt.complete', { count: newPages().length })"></span>
        <small x-text="$t('app.prompt.completeHint')"></small>
      </button>
      <button class="btn soft wide" x-show="cards.length && !(regeneratesInPlace() && off('lesson.regenerate'))" @click="extract()" :disabled="!canGenerate()">
        <span x-text="$t('app.prompt.regenerate')"></span>
        <small x-text="regeneratesInPlace() ? $t('app.prompt.regenerateHint') : $t('app.prompt.regenerateNewHint')"></small>
      </button>
      <p class="hint" x-show="cards.length && regeneratesInPlace() && lessonExported" x-text="$t('app.prompt.regenerateExported')"></p>

      <!-- No photo: the prompt alone (a word list, a topic…). Photos stay the main way. -->
      <div class="from-prompt" x-show="!cards.length && !photos.length">
        <!-- Only when the prompt can do without (worksWithoutPhoto); the hint says how -->
        <button class="btn soft wide" x-show="worksWithoutPhoto()" @click="extract()" :disabled="!canGenerate()"
                x-text="$t('app.prompt.fromPrompt')"></button>
        <p class="hint" x-text="$t('app.prompt.fromPromptHint')"></p>
      </div>
    </section>

    <!-- 3. Review -->
    <section class="panel review" x-cloak x-show="cards.length" x-ref="review">
      <div class="review-head">
        <h2><span class="step">3</span> <span x-text="$t('app.review.title')"></span> <a class="help-link" :href="$docs('review')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.review.title') })" :title="$t('common.helpOn', { topic: $t('app.review.title') })">?</a></h2>
        <span class="save-pill" :class="saveState">
          <span x-show="saveState === 'saved'" x-text="$t('app.review.saved')"></span>
          <span x-show="saveState === 'pending' || saveState === 'saving'" x-text="$t('app.review.saving')"></span>
          <span x-show="saveState === 'error'" x-text="$t('app.review.notSaved')"></span>
        </span>
        <!-- The open lesson can be deleted here too (same confirmation as in the list) -->
        <button class="icon-btn muted" x-show="lessonId && !readOnly()" @click="deleteLesson({ id: lessonId, deck })"
                :aria-label="$t('app.lessons.delete')" :title="$t('app.lessons.delete')">🗑</button>
      </div>

      <label class="field deck">
        <span x-text="$t('app.review.deck')"></span>
        <input x-model="deck" :readonly="readOnly()" list="decks" @focus="loadDecks()">
      </label>
      <p class="hint ai-choice" x-show="lessonChoice" x-text="$t('app.review.choice', { choice: lessonChoice })"></p>
      <datalist id="decks">
        <template x-for="d in decksForChild(decks)" :key="d"><option :value="d"></option></template>
      </datalist>
      <!-- The prompt this lesson was generated with (read-only; the prompt area above holds it too) -->
      <details class="lesson-prompt" x-show="lessonPrompt">
        <summary x-text="$t('app.review.promptUsed')"></summary>
        <p x-text="lessonPrompt"></p>
      </details>
      <!-- The child the lesson is for (else the Anki profile that created it); Anki open on
           another profile: its cards would go there, said with the children's names -->
      <div class="lesson-owner" x-show="lessonFor()">
        <span class="owner-name" x-html="$th('app.review.owner', { owner: lessonFor() })"></span>
        <p class="hint" x-show="readOnly()" x-text="$t('app.review.readOnly', { owner: lessonFor() })"></p>
        <p class="warn" x-show="lessonOwner && !lessonShared && anki.profile && anki.profile !== lessonOwner"
           x-text="$t('app.review.otherProfileOpen', { open: profileFor(anki.profile), child: lessonFor() })"></p>
      </div>
      <!-- The lesson for another child too: a copy of its own (its decks, its Anki profile) -->
      <button type="button" class="btn soft copy-lesson" x-show="lessonId && copyTargets().length"
              @click="copySheet = { open: true, busy: false, error: '' }" x-text="$t('app.copy.button')"></button>
      <!-- The lesson in a test to prepare: its cards tagged in Anki, revised together (app-exams.js) -->
      <button type="button" class="btn soft copy-lesson" x-show="lessonId && !readOnly()" @click="openExams()"
              x-text="examButtonLabel()"></button>
      <p class="count-line" x-text="$t('common.count.cards', { count: cards.length })"></p>

      <form class="revise" x-show="!readOnly()" @submit.prevent="revise()">
        <div class="dictated" :class="{ 'with-mic': mic.available }">
          <textarea x-model="revision.text" rows="2" :aria-label="$t('app.revise.label')" :disabled="dictating('correction')"
                    :placeholder="$t('app.revise.placeholder')"
                    @keydown.ctrl.enter.prevent="revise()" @keydown.meta.enter.prevent="revise()"></textarea>
          <button type="button" class="mic" x-show="mic.available" x-cloak
                :class="{ listening: mic.listening === 'correction', busy: mic.busy === 'correction' }"
                :disabled="mic.busy !== '' || (mic.listening !== '' && mic.listening !== 'correction')"
                @click="dictate('correction')" :aria-label="$t(micKey('correction'))" :title="$t(micKey('correction'))"
                x-text="mic.listening === 'correction' ? '⏹' : mic.busy === 'correction' ? '…' : '🎤'"></button>
        </div>
        <button class="btn primary" :disabled="!revision.text.trim() || revision.busy || dictating('correction')"
                x-text="$t('app.revise.button')"></button>
      </form>
      <p class="hint listening-hint" x-cloak x-show="dictationStep('correction')"
         x-text="$t(dictationStep('correction') || 'app.mic.busy')"></p>
      <div class="revision-result" x-cloak x-show="revision.summary" x-transition.opacity>
        <div>
          <strong x-text="revision.summary"></strong>
          <small x-text="revision.stats"></small>
        </div>
        <button class="btn soft" x-show="revision.undo" @click="undoRevision()" x-text="$t('app.revise.undo')"></button>
        <button class="icon-btn muted" @click="clearRevision()" :aria-label="$t('common.close')">✕</button>
      </div>

      <!-- The pictures no free one fits, after a generation: drawn only if the user says yes (it costs) -->
      <div class="notice-bar ask" x-cloak x-show="toDraw.length && !drawing && !readOnly()" role="status">
        <span><span x-text="$t('app.pictures.toDraw', { count: toDraw.length })"></span>
          <small x-show="drawingCost(toDraw.length)" x-text="drawingCost(toDraw.length)"></small></span>
        <button type="button" class="btn primary" @click="drawPictures(true)" x-text="$t('app.pictures.drawYes')"></button>
        <button type="button" class="btn soft" @click="toDraw = []" x-text="$t('app.pictures.toDrawNo')"></button>
      </div>

      <!-- Just made quick: once more, carefully (a rich lesson: a figure, maths) -->
      <div class="careful-again" x-show="madeQuick && regeneratesInPlace() && !off('lesson.regenerate')">
        <small class="hint" x-text="$t('app.review.madeQuick')"></small>
        <button class="btn soft" @click="extract({ careful: true })" :disabled="!canGenerate()"
                x-text="$t('app.review.carefulAgain')"></button>
      </div>

      <div class="diagram-hints" x-show="hasMasks()">
        <p class="hint" x-show="!readOnly()" x-text="$t('app.review.diagramHint')"></p>
        <p class="hint warn" x-show="diagramWarning" x-text="$t('app.review.diagramWarning')"></p>
      </div>

      <p class="hint" x-show="!readOnly() && cards.some((c) => isCloze(c.front))" x-text="$t('app.review.clozeHint')"></p>

      <div class="cards">
        <template x-for="card in cards" :key="card.key">
          <article class="flash" :data-card="card.key" :class="{ changed: card._state, linked: card._linked, 'has-explain': card._explain?.open, 'has-diagram': card.mask, 'has-picture': card.picture || card.picture_prompt || card.figure || card._panel }">
            <!-- Choosing the cards of a test (app-exams.js): one tick per card -->
            <label class="pick" x-cloak x-show="examPick">
              <input type="checkbox" :checked="examPick?.selected.has(card.id)" @change="togglePick(card)"
                     :aria-label="$t('app.exams.pick.card')">
            </label>
            <!-- Diagram label: the photo with every label hidden, this card's mask highlighted and movable -->
            <template x-if="card.mask && photoFor(card)">
              <div class="diagram">
                <img :src="photoFor(card)" alt="" draggable="false">
                <div class="crop-frame" :style="maskStyle(cropFor(card))" :title="$t('app.review.cropFrame')">
                  <template x-for="corner in ['nw', 'ne', 'sw', 'se']" :key="corner">
                    <i class="crop-handle" :class="corner" x-show="!readOnly()"
                       @pointerdown.stop="startCrop($event, card, corner)"></i>
                  </template>
                </div>
                <template x-for="other in masksOnPage(card)" :key="other.key">
                  <div class="mask" :class="{ target: other === card, editable: other === card && !readOnly() }"
                       :style="maskStyle(other.mask)" @pointerdown="other === card && startDrag($event, card, 'move')">
                    <span x-text="'(' + other.mask.n + ')'"></span>
                    <i class="handle" x-show="other === card && !readOnly()"
                       @pointerdown.stop="startDrag($event, card, 'resize')"></i>
                  </div>
                </template>
              </div>
            </template>
            <!-- Picture card: the picture shows with the front text (or with the answer, below) -->
            <div class="card-picture" :class="{ figure: card.figure }" x-show="!card.picture_on_back && (card.picture || card._drawing || ((card.picture_prompt || card.figure) && drawing))">
              <img x-show="card.picture && !card._drawing" :src="card.picture && pictureUrl(card)" :alt="card.figure || card.picture_prompt"
                   @click="openViewer([pictureUrl(card)], 0)">
              <span class="drawing" x-show="!card.picture || card._drawing" x-text="$t('app.pictures.drawing')"></span>
            </div>
            <div class="flash-body">
              <span class="flash-badge" x-show="card._state"
                    x-text="card._state === 'new' ? $t('app.review.badgeNew') : $t('app.review.badgeModified')"></span>
              <div class="front-row">
                <textarea class="front" rows="1" x-model="card.front" :readonly="readOnly()" :placeholder="$t('app.review.front')" :aria-label="$t('app.review.front')"
                          x-init="watchHeight($el)" x-effect="card.front; fitHeight($el)"></textarea>
                <!-- On the front's line, not a column beside the card (it made every card as tall as
                     its buttons); the rare ones (report, delete) behind ⋯ -->
                <div class="flash-actions">
                  <button class="icon-btn" x-show="lessonId && card.front.trim() && (card.back.trim() || isCloze(card.front))"
                          @click="explain(card)" :class="{ active: card._explain?.open }" :aria-label="$t('app.explain.button')"
                          :title="$t('app.explain.button')">💬</button>
                  <button class="icon-btn" x-show="hasAudio() && !hasMath(card.back) && !isCloze(card.front) && !card.choices.length" @click="play(spokenText(card))" :aria-label="$t('app.review.listen')">🔊</button>
                  <button class="icon-btn" x-show="!readOnly() && !card.mask && !isCloze(card.front) && lessonId" @click="togglePicturePanel(card)"
                          :class="{ active: card._panel }" :aria-label="$t('app.pictures.panel')">🖼️</button>
                  <div class="card-menu" x-show="reportable || !readOnly()" @click.outside="card._menu = false" @keydown.escape="card._menu = false">
                    <button class="icon-btn muted" @click="card._menu = !card._menu" :class="{ active: card._menu }"
                            :aria-expanded="Boolean(card._menu)" :aria-label="$t('app.review.more')" :title="$t('app.review.more')">⋯</button>
                    <div class="card-menu-items" x-show="card._menu">
                      <button type="button" x-show="reportable" @click="card._menu = false; openReport(card)">⚑ <span x-text="$t('app.report.button')"></span></button>
                      <button type="button" class="danger" x-show="!readOnly()" @click="card._menu = false; removeCard(card)">✕ <span x-text="$t('app.review.removeCard')"></span></button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="math-preview" x-show="hasMath(card.front) || isCloze(card.front)" x-html="previewHtml(card.front)"></div>
              <!-- The back, the info, the wrong options and the "did you know" grow with their text,
                   as the front: a long answer is seen whole -->
              <textarea class="back" rows="1" x-model="card.back" :readonly="readOnly()" @keydown.enter.prevent
                        :placeholder="isCloze(card.front) ? $t('app.review.extra') : card.choices.length ? $t('app.review.rightChoice') : $t('app.review.back')"
                        :aria-label="card.choices.length ? $t('app.review.rightChoice') : $t('app.review.back')"
                        x-init="watchHeight($el)" x-effect="card.back; fitHeight($el)"></textarea>
              <div class="math-preview back" x-show="hasMath(card.back)" x-html="previewHtml(card.back)"></div>
              <!-- Multiple choice, true/false: the back is the right answer, these the wrong ones -->
              <div class="choices" x-show="card.choices.length">
                <template x-for="(choice, n) in card.choices" :key="n">
                  <div class="choice">
                    <span class="wrong" aria-hidden="true">✗</span>
                    <textarea class="grow" rows="1" x-model="card.choices[n]" :readonly="readOnly()" @keydown.enter.prevent
                              :placeholder="$t('app.review.wrongChoice')" :aria-label="$t('app.review.wrongChoice')"
                              x-init="watchHeight($el)" x-effect="card.choices[n]; fitHeight($el)"></textarea>
                    <button class="icon-btn muted" x-show="!readOnly() && card.choices.length > 1" @click="card.choices.splice(n, 1)"
                            :aria-label="$t('app.review.removeChoice')">✕</button>
                  </div>
                </template>
                <button class="link-btn" x-show="!readOnly()" @click="card.choices.push('')" x-text="$t('app.review.addChoice')"></button>
              </div>
              <!-- The picture belongs to the answer ("What is a tangent?"): shown under it, as in Anki -->
              <div class="card-picture on-back" :class="{ figure: card.figure }" x-show="card.picture_on_back && (card.picture || card._drawing || ((card.picture_prompt || card.figure) && drawing))">
                <img x-show="card.picture && !card._drawing" :src="card.picture && pictureUrl(card)" :alt="card.figure || card.picture_prompt"
                   @click="openViewer([pictureUrl(card)], 0)">
                <span class="drawing" x-show="!card.picture || card._drawing" x-text="$t('app.pictures.drawing')"></span>
              </div>
              <div class="meta">
                <textarea class="info" rows="1" x-model="card.info" :readonly="readOnly()" @keydown.enter.prevent
                          :placeholder="$t('app.review.info')" :aria-label="$t('app.review.infoLabel')"
                          x-init="watchHeight($el)" x-effect="card.info; fitHeight($el)"></textarea>
                <input class="subdeck" x-model="card.subdeck" :readonly="readOnly()" :placeholder="$t('app.review.subdeck')"
                       :aria-label="$t('app.review.subdeckLabel')"
                       list="subdecks" :size="Math.max(card.subdeck.length, 10)">
              </div>
              <!-- Shown under the info on the back, in Anki; cleared, it's gone -->
              <div class="fun-fact" x-show="card.fun_fact">
                <span aria-hidden="true">💡</span>
                <textarea class="grow" rows="1" x-model="card.fun_fact" :readonly="readOnly()" @keydown.enter.prevent
                          :aria-label="$t('app.review.funFact')"
                          x-init="watchHeight($el)" x-effect="card.fun_fact; fitHeight($el)"></textarea>
              </div>
              <!-- The helps written at generation: on the back in Anki; cleared, they're gone -->
              <div class="card-help" x-show="card.explanation">
                <span aria-hidden="true">💬</span>
                <textarea rows="2" x-model="card.explanation" :readonly="readOnly()" :aria-label="$t('app.review.explanation')"></textarea>
              </div>
              <div class="card-help" x-show="card.mnemonic">
                <span aria-hidden="true">🧠</span>
                <textarea rows="2" x-model="card.mnemonic" :readonly="readOnly()" :aria-label="$t('app.review.mnemonic')"></textarea>
              </div>
            </div>
            <!-- 💬 The card explained, on demand; then only the follow-ups the AI says would help -->
            <div class="explain" x-show="card._explain?.open">
              <template x-for="(block, b) in card._explain?.blocks ?? []" :key="b">
                <p class="explain-block">
                  <strong x-show="block.kind !== 'explain'" x-text="$t('app.explain.kinds.' + block.kind)"></strong>
                  <span x-text="block.text"></span>
                </p>
              </template>
              <p class="hint" x-show="card._explain?.loading" x-text="$t('app.explain.thinking')"></p>
              <p class="error-text" x-show="card._explain?.error" x-text="card._explain?.error"></p>
              <div class="explain-actions">
                <template x-for="k in card._explain?.more ?? []" :key="k">
                  <button class="chip" @click="explain(card, k)" :disabled="Boolean(card._explain?.loading)"
                          x-text="$t('app.explain.ask.' + k)"></button>
                </template>
                <button class="link-btn" x-show="!readOnly() && card._explain?.blocks.length && !card._explain?.kept"
                        @click="keepExplanation(card)" x-text="$t('app.explain.keep')"></button>
                <button class="icon-btn muted" @click="card._explain.open = false" :aria-label="$t('common.close')">✕</button>
              </div>
            </div>
            <!-- The card's picture: what to draw, redraw, own photo, none. (:disabled always
                 a boolean: Alpine leaves a button disabled when its value is undefined) -->
            <div class="picture-panel" x-show="card._panel">
              <!-- Where the picture comes from (a free one: its page, to check it) -->
              <p class="picture-source" x-show="card.picture && pictureSourceText(card)">
                <span x-text="pictureSourceText(card)"></span>
                <a x-show="card.picture_source?.page" :href="card.picture_source?.page" target="_blank" rel="noopener"
                   x-text="$t('app.pictures.sourcePage')"></a>
              </p>
              <label class="field">
                <span x-text="card.figure ? $t('app.pictures.figure') : $t('app.pictures.subject')"></span>
                <input x-model="card._subject" :placeholder="card.figure ? $t('app.pictures.figurePlaceholder') : $t('app.pictures.subjectPlaceholder')"
                       @keydown.enter.prevent="makePicture(card)">
              </label>
              <label class="switch">
                <input type="checkbox" x-model="card.picture_on_back">
                <span class="track"><span class="knob"></span></span>
                <span x-text="$t('app.pictures.onBack')"></span>
              </label>
              <div class="picture-actions">
                <!-- One button, the cheapest first (makePicture): a figure, a free picture, else asked -->
                <button type="button" class="btn soft" x-show="!(off('pictures.search') && off('pictures.draw'))"
                        @click="makePicture(card)" :disabled="Boolean(card._drawing || card._searching)"
                        x-text="card._searching ? $t('app.pictures.searching') : card.picture ? $t('app.pictures.change') : $t('app.pictures.make')"></button>
                <label class="btn soft" :class="{ disabled: card._drawing }">
                  <span x-text="$t('app.pictures.photo')"></span>
                  <input type="file" accept="image/*" hidden :disabled="Boolean(card._drawing)" @change="uploadPicture(card, $event)">
                </label>
                <button type="button" class="btn danger-soft" x-show="card.picture" @click="removePicture(card)"
                        :disabled="Boolean(card._drawing)" x-text="$t('app.pictures.remove')"></button>
              </div>
              <!-- The pictures found: tap one, it becomes the card's -->
              <template x-if="card._found">
                <div class="found">
                  <p class="hint" x-show="!card._found.length && !card._searching" x-text="$t('app.pictures.none')"></p>
                  <p class="hint" x-show="card._found.length > 1 && !card._searching" x-text="$t('app.pictures.pick')"></p>
                  <div class="found-grid" x-show="card._found.length">
                    <template x-for="(f, i) in card._found" :key="f.source + f.id">
                      <button type="button" class="found-pick" @click="chooseFound(card, f)" :disabled="Boolean(card._drawing)"
                              :title="f.title + ' · ' + f.licence" :aria-label="f.title + ' · ' + f.licence">
                        <img :src="f.preview" alt="">
                        <span class="found-best" x-show="i === 0 && !card._searching && card._found.length > 1" aria-hidden="true">⭐</span>
                      </button>
                    </template>
                  </div>
                  <small class="muted" x-show="card._found.length" x-text="$t('app.pictures.found', { sources: foundSources(card) })"></small>
                </div>
              </template>
              <!-- No free picture fits: drawn by the image model only if the user says yes (it costs) -->
              <div class="draw-ask" x-show="card._ask">
                <p x-text="$t('app.pictures.drawAsk', { subject: card.picture_prompt })"></p>
                <small class="muted" x-show="drawingCost()" x-text="drawingCost()"></small>
                <div class="picture-actions">
                  <button type="button" class="btn primary" @click="drawPicture(card)" :disabled="Boolean(card._drawing)"
                          x-text="$t('app.pictures.drawYes')"></button>
                  <button type="button" class="btn soft" @click="card._ask = false" x-text="$t('app.pictures.drawNo')"></button>
                </div>
              </div>
              <small class="muted" x-text="card.figure ? $t('app.pictures.figureCost') : $t('app.pictures.cost')"></small>
            </div>
          </article>
        </template>
      </div>
      <datalist id="subdecks">
        <template x-for="s in subdecks()" :key="s"><option :value="s"></option></template>
      </datalist>

      <button class="btn dashed wide" x-show="!readOnly()" @click="addCard()" x-text="$t('app.review.addCard')"></button>

      <div class="export-options">
        <!-- How the cards are asked: said in the prompt, changed by a correction ("both ways") -->
        <p class="hint" x-show="askedHow()">
          <span x-text="askedHow()"></span>
          <small x-show="!readOnly()" x-text="$t('app.review.optionsChange')"></small>
        </p>
        <p class="hint" x-show="voice">
          <span x-show="hasAudio()" x-html="$th('app.review.voiceIncluded', { voice })"></span>
          <span x-show="!hasAudio()" x-html="$th('app.review.voiceDevice', { voice })"></span>
        </p>
      </div>
    </section>

    <!-- Language: automatic (Anki's or the browser's) or picked here, for this device -->
    <footer class="page-footer">
      <button type="button" class="anki-link" x-cloak x-show="reviewInAnki" @click="openAnkiDroid()">
        <img class="anki-icon" x-show="ankiIcon" :src="ankiIcon" alt=""><span x-show="!ankiIcon" aria-hidden="true">🎓</span>
        <span x-text="$t('app.openAnkiDroid')"></span>
      </button>
      <a class="docs-link" :href="$docs('')" target="_blank" rel="noopener">📖 <span x-text="$t('common.help')"></span></a>
      <!-- Not where Notosaurus is paid for already (the Android app's subscription) -->
      <a class="support-link" x-show="donations" href="https://ko-fi.com/notosaurus" target="_blank" rel="noopener">☕ <span x-text="$t('common.support')"></span></a>
      <label class="lang-select">
        <span aria-hidden="true">🌐</span>
        <select :aria-label="$t('common.language')" :value="$store.i18n.choice"
                @change="setLanguage($event.target.value)">
          <option value="" :selected="!$store.i18n.choice"
                  x-text="$t('common.languageAuto', { name: $store.i18n.names[$store.i18n.auto] || $store.i18n.auto })"></option>
          <template x-for="code in $store.i18n.available" :key="code">
            <option :value="code" :selected="$store.i18n.choice === code" x-text="$store.i18n.names[code] || code"></option>
          </template>
        </select>
      </label>
    </footer>
  </main>

  <!-- Bottom action bar -->
  <!-- Choosing a test's cards: how many, finish (app-exams.js) -->
  <div class="bottom-bar" x-cloak x-show="examPick">
    <div class="bar-row pick-bar">
      <span class="pick-count" x-text="$t('app.exams.pick.bar', { count: examPick?.selected.size ?? 0, name: examPick?.name ?? '' })"></span>
      <button class="btn soft" @click="pickAll()" x-text="$t('app.exams.pick.all')"></button>
      <button class="btn soft" @click="cancelPick()" x-text="$t('common.cancel')"></button>
      <button class="btn primary" @click="finishPick()" x-text="$t('app.exams.pick.done')"></button>
    </div>
  </div>
  <div class="bottom-bar" x-show="bottomBar() && !examPick">
    <!-- No photo yet: it opens the camera (as the 📷 tile); then it makes the cards -->
    <button class="btn primary wide" x-show="!cards.length" @click="photos.length ? extract() : $refs.camera.click()"
            :disabled="photos.length ? !canGenerate() : loading"
            x-text="photos.length ? $t('app.actions.generate') : $t('app.actions.startWithPhoto')"></button>
    <div class="bar-row" x-show="cards.length">
      <!-- Anki reachable: send directly, keep the file as a secondary option -->
      <button class="btn soft" x-show="anki.available && apkg" @click="exportApkg()" :disabled="exporting || sending"
              :aria-label="$t('app.actions.downloadApkg')">⬇️ .apkg</button>
      <!-- Sent already (the app): reviewed in AnkiDroid from here -->
      <button class="btn soft" x-show="reviewInAnki && lessonExported" @click="reviewLesson()" :disabled="sending"
              x-text="$t('app.reviewInAnki')"></button>
      <button class="btn primary wide" x-show="anki.available && !off('anki.send')" @click="sendToAnki()" :disabled="sending || exporting">
        <!-- Sent before: sending again updates its cards in Anki (moves them if its deck changed) -->
        <span x-text="sending ? (sendStep || $t('app.actions.sending')) : $t(lessonExported ? 'app.actions.updateInAnki' : 'app.actions.addToAnki')"></span>
      </button>
      <button class="btn primary wide" x-show="!anki.available" @click="exportApkg()" :disabled="exporting">
        <span x-text="exporting ? $t('app.actions.exporting') : $t('app.actions.exportApkg')"></span>
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="overlay" x-cloak x-show="loading || revision.busy" x-transition.opacity>
    <div class="loading-card">
      <div class="spinner"></div>
      <strong x-text="revision.busy ? $t('app.loading.revising') : photos.length ? $t('app.loading.reading') : $t('app.loading.writing')"></strong>
      <small x-text="!revision.busy && loadingQuick ? $t('app.loading.durationQuick') : $t('app.loading.duration')"></small>
      <!-- The cards as the AI writes them: the last ones, while the others come -->
      <ul class="coming" x-show="loading && coming.length">
        <template x-for="(card, i) in coming.slice(-5)" :key="coming.length - 5 + i">
          <li><strong x-text="comingFront(card)"></strong> <span x-text="card.back"></span></li>
        </template>
      </ul>
      <button class="btn soft" x-show="loading && generating" @click="cancelGeneration()" :disabled="cancelling"
              x-text="cancelling ? $t('app.loading.cancelling') : $t('common.cancel')"></button>
    </div>
  </div>

  <!-- Lessons sheet -->
  <div class="sheet-backdrop" x-cloak x-show="lessonsOpen" x-transition.opacity @click="lessonsOpen = false"></div>
  <aside class="sheet" x-cloak x-show="lessonsOpen" x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="lessonsOpen = false" :aria-label="$t('app.lessons.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="$t('app.lessons.title')"></span> <a class="help-link" :href="$docs('lessons')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.lessons.title') })" :title="$t('common.helpOn', { topic: $t('app.lessons.title') })">?</a></h2>
      <button class="icon-btn" @click="lessonsOpen = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <!-- The tests to prepare: lessons under one tag in Anki, revised together (app-exams.js) -->
    <section class="exam-list">
      <h3 class="exam-head">
        <span x-text="$t('app.exams.title')"></span>
        <button type="button" class="chip-btn" @click="lessonsOpen = false; openExams(null, true)" x-text="$t('app.exams.newShort')"></button>
      </h3>
      <ul class="child-rows">
        <template x-for="e in exams" :key="e.id">
          <li>
            <button type="button" class="child-row" @click="lessonsOpen = false; openExams(e)">
              <strong x-text="e.name"></strong>
              <small class="muted" x-text="examDate(e)"></small>
              <small class="muted" x-text="$t('common.count.lessons', { count: e.lessons.length })"></small>
            </button>
          </li>
        </template>
      </ul>
    </section>
    <!-- What filters the lessons, right above them (the tests to prepare aren't filtered) -->
    <label class="switch profile-filter" x-show="children.length > 1">
      <input type="checkbox" x-model="allChildren">
      <span class="track"><span class="knob"></span></span>
      <span x-text="allChildren ? $t('app.children.allLessons') : $t('app.children.lessonsOf', { name: currentChild()?.name ?? '' })"></span>
    </label>
    <input type="search" class="lesson-search" x-show="manyLessons()" x-model="lessonQuery"
           :placeholder="$t('app.lessons.search')" :aria-label="$t('app.lessons.search')">
    <!-- By subject (the deck's first level), the most recent first; see lessonSections() -->
    <div class="lesson-list">
      <p class="empty" x-show="!visibleLessons().length" x-text="$t('app.lessons.none')"></p>
      <template x-for="g in lessonSections()" :key="g.key">
        <section class="lesson-group">
          <h3>
            <button type="button" class="group-head" :disabled="!g.foldable" @click="toggleSubject(g)"
                    :aria-expanded="g.foldable ? String(g.open) : null">
              <span class="fold" x-show="g.foldable" x-text="g.open ? '▾' : '▸'" aria-hidden="true"></span>
              <span x-text="g.name"></span>
              <span class="count" x-show="g.count !== undefined" x-text="g.count"></span>
            </button>
          </h3>
          <p class="empty" x-show="g.key === 'found' && !g.count" x-text="$t('app.lessons.notFound')"></p>
          <ul x-show="g.open">
            <template x-for="l in g.lessons" :key="l.id">
              <li :class="{ current: l.id === lessonId }">
                <button class="lesson" @click="openLesson(l.id); lessonsOpen = false" :title="l.deck">
                  <strong x-text="l.title"></strong>
                  <small>
                    <span x-text="formatDate(l.updated_at)"></span> ·
                    <span x-text="$t('common.count.cards', { count: l.card_count })"></span>
                    <span x-show="l.owner && (!anki.profile || l.owner !== anki.profile)" x-text="' · 👤 ' + l.owner"></span>
                  </small>
                </button>
                <span class="badge shared" x-show="l.shared" x-text="$t('app.lessons.sharedBadge')"></span>
                <span class="badge" x-show="l.exported_at" x-text="$t('app.lessons.exported')"></span>
                <button class="icon-btn muted" x-show="canDelete(l)" @click="deleteLesson(l)" :aria-label="$t('app.lessons.delete')">🗑</button>
              </li>
            </template>
          </ul>
        </section>
      </template>
    </div>
  </aside>

  <!-- PDF page picker: more pages than places left -->
  <div class="sheet-backdrop" x-cloak x-show="pdf.open" x-transition.opacity @click="donePdfPicker(false)"></div>
  <aside class="sheet" x-cloak x-show="pdf.open" x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="pdf.open && donePdfPicker(false)" :aria-label="$t('app.pdf.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="$t('app.pdf.title')"></span> <a class="help-link" :href="$docs('photos')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.pdf.title') })" :title="$t('common.helpOn', { topic: $t('app.pdf.title') })">?</a></h2>
      <button class="icon-btn" @click="donePdfPicker(false)" :aria-label="$t('common.close')">✕</button>
    </div>
    <p class="hint" x-text="$t('app.pdf.hint', { name: pdf.name, count: pdf.pages.length, free: pdf.free })"></p>
    <div class="pdf-pages">
      <template x-for="p in pdf.pages" :key="p.n">
        <button type="button" class="pdf-page" :class="{ chosen: p.chosen }" :aria-pressed="String(p.chosen)"
                :disabled="!p.chosen && pdfChosen().length >= pdf.free" @click="p.chosen = !p.chosen"
                :aria-label="$t('app.photos.page', { n: p.n })">
          <img x-show="p.url" :src="p.url" alt="">
          <span class="pdf-page-n" x-text="p.n"></span>
        </button>
      </template>
    </div>
    <button class="btn primary wide" :disabled="!pdfChosen().length" @click="donePdfPicker(true)"
            x-text="$t('app.pdf.add', { count: pdfChosen().length, free: pdf.free })"></button>
  </aside>

  <!-- Prompt picker sheet -->
  <div class="sheet-backdrop" x-cloak x-show="picker.open" x-transition.opacity @click="picker.open = false"></div>
  <aside class="sheet" x-cloak x-show="picker.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="asking.open || (picker.open = false)" :aria-label="$t('app.picker.label')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="$t('app.picker.title')"></span> <small class="muted" x-text="'(' + prompts.length + ')'"></small> <a class="help-link" :href="$docs('instructions')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.picker.title') })" :title="$t('common.helpOn', { topic: $t('app.picker.title') })">?</a></h2>
      <button class="icon-btn" @click="picker.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="picker-tools">
      <input type="search" x-model="picker.query" x-ref="pickerSearch" :placeholder="$t('app.picker.search')"
             @keydown.enter.prevent="filteredPrompts().length === 1 && choose(filteredPrompts()[0].id)">
      <button class="btn soft" @click="picker.open = false; openEditor('new')" x-text="$t('app.prompt.new')"></button>
    </div>
    <ul class="picker-list">
      <template x-for="c in filteredPrompts()" :key="c.id">
        <li>
          <button class="picker-item" :class="{ current: c.id === selectedId }" @click="choose(c.id)">
            <strong x-text="(c.builtin ? '⭐ ' : '') + c.name"></strong>
            <small x-text="c.text"></small>
          </button>
          <button class="icon-btn muted" @click="duplicatePrompt(c)" :aria-label="$t('app.picker.duplicate', { name: c.name })">⧉</button>
          <button class="icon-btn muted" x-show="!c.builtin" @click="deletePrompt(c)" :aria-label="$t('app.picker.delete', { name: c.name })">🗑</button>
        </li>
      </template>
      <li class="empty" x-show="!filteredPrompts().length" x-text="$t('app.picker.none')"></li>
    </ul>
  </aside>

  <!-- Prompt editor sheet -->
  <div class="sheet-backdrop" x-cloak x-show="editor.open" x-transition.opacity @click="editor.open = false"></div>
  <aside class="sheet" x-cloak x-show="editor.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
         x-transition:leave="sheet-anim" x-transition:leave-end="sheet-down"
         @keydown.escape.window="asking.open || (editor.open = false)" :aria-label="$t('app.prompt.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2><span x-text="editor.builtin ? $t('app.editor.builtin') : editor.id ? $t('app.editor.edit') : $t('app.editor.new')"></span> <a class="help-link" :href="$docs('instructions')" target="_blank" rel="noopener" :aria-label="$t('common.helpOn', { topic: $t('app.picker.title') })" :title="$t('common.helpOn', { topic: $t('app.picker.title') })">?</a></h2>
      <button class="icon-btn" @click="editor.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <form class="sheet-body" @submit.prevent="editor.builtin ? duplicatePrompt(editor) : saveEditor()">
      <p class="hint" x-show="editor.builtin" x-text="$t('app.editor.builtinHint')"></p>
      <label class="field">
        <span x-text="$t('app.editor.name')"></span>
        <input x-model="editor.name" x-ref="editorName" :placeholder="$t('app.editor.namePlaceholder')" required :disabled="editor.builtin">
      </label>
      <label class="field">
        <span x-text="$t('app.editor.text')"></span>
        <textarea x-model="editor.text" rows="5" required :placeholder="$t('app.editor.textPlaceholder')" :disabled="editor.builtin"></textarea>
      </label>
      <label class="field">
        <span><span x-text="$t('app.editor.deck')"></span> <small class="muted" x-text="$t('common.optional')"></small></span>
        <input x-model="editor.deck" :placeholder="$t('app.editor.deckPlaceholder')" :disabled="editor.builtin">
        <small x-text="$t('app.editor.deckHint')"></small>
      </label>
      <!-- The voice, a typed answer, a dictation: what the AI reads in the text (Notosaurus's
           prompts: their own) -->
      <p class="hint" x-show="!editor.builtin" x-text="$t('app.editor.optionsHint')"></p>
      <p class="hint error-text" x-show="editor.error" x-text="editor.error"></p>
      <div class="sheet-actions">
        <button type="button" class="btn danger-soft" x-show="editor.id && !editor.builtin" @click="deletePrompt()"
                x-text="$t('common.delete')"></button>
        <button type="button" class="btn soft" x-show="editor.id && !editor.builtin" @click="duplicatePrompt(editor)"
                x-text="$t('app.editor.duplicate')"></button>
        <button type="submit" class="btn primary"
                x-text="editor.builtin ? $t('app.editor.duplicateToChange') : editor.id ? $t('common.save') : $t('app.editor.create')"></button>
      </div>
    </form>
  </aside>

  <!-- Part of a photo hidden before it is sent: blacked out with a finger, un-blacked the same way -->
  <div class="hide-editor" x-cloak x-show="hiding.open" role="dialog" :aria-label="$t('app.hide.title')"
       @keydown.escape.window="hiding.open && doneHide(false)">
    <p class="hide-hint">
      <strong x-text="$t('app.hide.title')"></strong>
      <span x-text="$t('app.hide.hint')"></span>
      <span x-show="hiding.pdf" x-text="$t('app.hide.pdf')"></span>
    </p>
    <div class="hide-frame">
      <canvas x-ref="hideCanvas" @pointerdown="hideStroke($event)" @pointermove="hideStroke($event)"
              @pointerup="hideStroke($event)" @pointercancel="hideStroke($event)"></canvas>
    </div>
    <div class="hide-tools">
      <div class="hide-modes" role="group">
        <button type="button" class="btn soft" :class="{ chosen: !hiding.erase }" :aria-pressed="String(!hiding.erase)"
                @click="hiding.erase = false"><span aria-hidden="true">⬛</span> <span x-text="$t('app.hide.paint')"></span></button>
        <button type="button" class="btn soft" :class="{ chosen: hiding.erase }" :aria-pressed="String(hiding.erase)"
                @click="hiding.erase = true"><span aria-hidden="true">◻️</span> <span x-text="$t('app.hide.erase')"></span></button>
      </div>
      <button type="button" class="btn soft" @click="clearHidden()" x-text="$t('app.hide.clear')"></button>
      <button type="button" class="btn soft" @click="doneHide(false)" x-text="$t('common.cancel')"></button>
      <button type="button" class="btn primary" @click="doneHide(true)" x-text="$t('app.hide.done')"></button>
    </div>
  </div>

  <!-- A photo (or a card's picture) in full: ‹ › or a swipe between pages, a tap on it for its real size -->
  <div class="viewer" x-cloak x-show="viewer.open" x-transition.opacity role="dialog" :aria-label="$t('app.viewer.label')"
       @keydown.escape.window="viewer.open = false" @keydown.arrow-left.window="viewer.open && moveViewer(-1)"
       @keydown.arrow-right.window="viewer.open && moveViewer(1)" @click.self="viewer.open = false"
       @touchstart="viewer.touchX = $event.touches[0].clientX"
       @touchend="if (!viewer.zoomed) swipeViewer($event.changedTouches[0].clientX)">
    <div class="viewer-frame" :class="{ zoomed: viewer.zoomed }" @click.self="viewer.open = false">
      <img :src="viewer.list[viewer.index]" :alt="$t('app.photos.page', { n: viewer.index + 1 })"
           @click="viewer.zoomed = !viewer.zoomed">
    </div>
    <button class="viewer-close" @click="viewer.open = false" :aria-label="$t('common.close')">✕</button>
    <template x-if="viewer.list.length > 1">
      <div>
        <button class="viewer-nav prev" @click="moveViewer(-1)" :aria-label="$t('app.viewer.previous')">‹</button>
        <button class="viewer-nav next" @click="moveViewer(1)" :aria-label="$t('app.viewer.next')">›</button>
        <span class="viewer-count" x-text="`${viewer.index + 1} / ${viewer.list.length}`"></span>
      </div>
    </template>
  </div>

  <!-- The children (app-children.js): the one the next lesson is for, their cards -->
  <div class="sheet-backdrop" x-cloak x-show="childrenSheet.open" x-transition.opacity @click="childrenSheet.open = false"></div>
  <aside class="sheet" x-cloak x-show="childrenSheet.open" @keydown.escape.window="childrenSheet.open = false"
         role="dialog" :aria-label="$t('app.children.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="$t('app.children.title')"></h2>
      <button class="icon-btn" @click="childrenSheet.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body children">
      <!-- The choice: a row each, tapped: chosen (the sheet closes) -->
      <template x-if="childrenSheet.editing === null">
        <div>
          <!-- On the computer: the children of the Anki profile open (each card is its profile's) -->
          <p class="hint" x-text="$t('app.children.pick')"></p>
          <ul class="child-rows">
            <template x-for="(c, i) in childrenSheet.list" :key="c.id">
              <li :class="{ current: c.id === childId }" x-show="ofProfile(c)">
                <button type="button" class="child-row" @click="chooseChild(c.id)" :aria-pressed="String(c.id === childId)">
                  <span class="child-check" aria-hidden="true" x-text="c.id === childId ? '✓' : ''"></span>
                  <strong x-text="c.name"></strong>
                  <small class="muted" x-text="c.grade"></small>
                </button>
                <button type="button" class="icon-btn" @click="editChild(i)" :aria-label="$t('app.children.edit', { name: c.name })"
                        :title="$t('app.children.edit', { name: c.name })">✏️</button>
              </li>
            </template>
          </ul>
          <p class="hint" x-text="$t('app.children.hint')"></p>
          <div class="sheet-actions">
            <button type="button" class="btn soft" @click="addChild()" x-text="$t('app.children.add')"></button>
          </div>
        </div>
      </template>
      <!-- One child's card, edited on its own -->
      <template x-if="childrenSheet.editing !== null && childrenSheet.list[childrenSheet.editing]">
        <div class="child-card" x-data="{ get c() { return childrenSheet.list[childrenSheet.editing] ?? { name: '', grade: '', decks: '', instructions: '' } } }">
          <label class="field">
            <span x-text="$t('app.children.name')"></span>
            <input class="child-name" x-model="c.name" maxlength="40">
          </label>
          <label class="field">
            <span x-text="$t('app.children.grade')"></span>
            <select :value="c.grade" @change="setGrade(c, $event.target.value)">
              <option value="" x-text="$t('app.children.noGrade')"></option>
              <template x-for="g in $t('app.children.grades').split('|')" :key="g">
                <option :value="g" x-text="g" :selected="c.grade === g"></option>
              </template>
            </select>
          </label>
          <label class="field">
            <span x-text="$t('app.children.decks')"></span>
            <input x-model="c.decks" maxlength="200" :placeholder="$t('app.children.decksPlaceholder')">
          </label>
          <div class="chips" x-show="c.name.trim()">
            <button type="button" class="chip" @click="c.decks = c.name.trim()" x-text="c.name.trim()"></button>
            <button type="button" class="chip" x-show="c.grade" @click="c.decks = decksWithClass(c)" x-text="decksWithClass(c)"></button>
          </div>
          <label class="field">
            <span x-text="$t('app.children.instructions')"></span>
            <textarea x-model="c.instructions" rows="2" maxlength="4000" :placeholder="instructionsExample(c)"></textarea>
          </label>
          <p class="hint error-text" x-show="childrenSheet.error" x-text="childrenSheet.error"></p>
          <div class="sheet-actions">
            <button type="button" class="btn danger-soft" x-show="c.id" @click="removeChild(childrenSheet.editing)" x-text="$t('app.children.remove')"></button>
            <button type="button" class="btn soft" @click="cancelChild()" x-text="$t('common.cancel')"></button>
            <button type="button" class="btn primary" @click="saveChildren()" :disabled="childrenSheet.saving || !c.name.trim()"
                    x-text="$t('app.children.save')"></button>
          </div>
        </div>
      </template>
    </div>
  </aside>

  <!-- The tests to prepare (app-exams.js): the list, with the open lesson's place in each;
       one test: how to revise it in Anki, its lessons -->
  <div class="sheet-backdrop" x-cloak x-show="examSheet.open" x-transition.opacity @click="examSheet.open = false"></div>
  <aside class="sheet" x-cloak x-show="examSheet.open" @keydown.escape.window="asking.open || (examSheet.open = false)"
         role="dialog" :aria-label="$t('app.exams.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <button type="button" class="link back" x-show="examSheet.view === 'detail'" @click="backToExams()" x-text="$t('app.exams.back')"></button>
      <button type="button" class="link back" x-show="examSheet.view === 'add'" @click="showExam(examSheet.exam)" x-text="'‹ ' + (examSheet.exam?.name ?? '')"></button>
      <h2 x-show="examSheet.view === 'list'" x-text="lessonId && !examSheet.alone ? $t('app.exams.titleFor') : $t('app.exams.title')"></h2>
      <h2 x-show="examSheet.view === 'add'" x-text="$t('app.exams.addLessons')"></h2>
      <h2 x-show="examSheet.view === 'detail'" x-text="examSheet.exam?.name ?? ''"></h2>
      <button class="icon-btn" @click="examSheet.open = false" :aria-label="$t('common.close')">✕</button>
    </div>

    <!-- Every test: the open lesson added to one, whole or some cards; a new one -->
    <div class="sheet-body children" x-show="examSheet.view === 'list'">
      <p class="hint" x-text="$t('app.exams.hint')"></p>
      <p class="empty" x-show="!exams.length" x-text="$t('app.exams.none')"></p>
      <ul class="child-rows exam-rows">
        <template x-for="e in exams" :key="e.id">
          <li :class="{ current: lessonId && !examSheet.alone && examPart(e) }">
            <button type="button" class="child-row" @click="showExam(e)" :disabled="examSheet.busy">
              <strong x-text="e.name"></strong>
              <small class="muted" x-text="examDate(e)"></small>
              <small class="muted" x-text="$t('common.count.lessons', { count: e.lessons.length })"></small>
              <span class="badge" x-show="examPast(e)" x-text="$t('app.exams.past')"></span>
            </button>
            <div class="exam-actions" x-show="lessonId && !examSheet.alone">
              <button type="button" class="chip-btn" :class="{ on: examPart(e) }" @click="toggleExamLesson(e)" :disabled="examSheet.busy"
                      x-text="!examPart(e) ? $t('app.exams.add') : examPart(e).cards === null ? $t('app.exams.inWhole') : $t('app.exams.inSome', { count: examPart(e).cards.length })"></button>
              <button type="button" class="chip-btn" @click="startPick(e)" :disabled="examSheet.busy" x-text="$t('app.exams.pickCards')"></button>
            </div>
          </li>
        </template>
      </ul>
      <form class="exam-new" @submit.prevent="createExam()">
        <h3 x-text="$t('app.exams.new')"></h3>
        <label>
          <span x-text="$t('app.exams.name')"></span>
          <input type="text" x-model="examSheet.draft.name" maxlength="60" required :placeholder="$t('app.exams.namePlaceholder')">
        </label>
        <label>
          <span x-text="$t('app.exams.date')"></span>
          <input type="date" x-model="examSheet.draft.date">
        </label>
        <button type="submit" class="btn primary" :disabled="examSheet.busy || !examSheet.draft.name.trim()" x-text="$t('app.exams.create')"></button>
      </form>
      <p class="hint error-text" x-show="examSheet.error" x-text="examSheet.error"></p>
    </div>

    <!-- One test: how to revise it in Anki, then its lessons -->
    <div class="sheet-body children" x-show="examSheet.view === 'detail' && examSheet.exam">
      <template x-if="examSheet.exam">
        <div>
          <p class="hint" x-show="examSheet.exam.date">
            <span x-text="examDate(examSheet.exam)"></span>
            <span class="badge" x-show="examPast(examSheet.exam)" x-text="$t('app.exams.past')"></span>
          </p>
          <section class="exam-guide" x-show="examSheet.exam.lessons.length">
            <h3 x-text="reviewInAnki ? $t('app.exams.guide.titleAndroid') : $t('app.exams.guide.titleDesktop')"></h3>
            <!-- The computer, Anki open: the filtered deck made and shown from here (AnkiConnect) -->
            <div class="exam-review" x-show="!reviewInAnki && anki.available">
              <button type="button" class="btn primary" @click="reviewExam(examSheet.exam)" :disabled="examSheet.busy"
                      x-text="examSheet.busy ? $t('app.exams.reviewing') : $t('app.exams.reviewNow')"></button>
              <p class="hint ok" x-show="examSheet.reviewed" x-text="examSheet.reviewed"></p>
              <p class="hint" x-text="$t('app.exams.manual')"></p>
            </div>
            <!-- AnkiDroid: no app may make a filtered deck there; its browser, opened on the test's
                 cards, makes it from its menu (any decks the lessons are in) -->
            <ol x-show="reviewInAnki">
              <li>
                <span x-text="$t('app.exams.guide.droid1')"></span>
                <button type="button" class="chip-btn" @click="browseExam(examSheet.exam)" x-text="$t('app.exams.guide.droidOpen')"></button>
              </li>
              <li x-html="$th('app.exams.guide.droid2')"></li>
              <li x-html="$th('app.exams.guide.droid3', { limit: 100 })"></li>
            </ol>
            <ol x-show="!reviewInAnki && examSheet.exam.deck">
              <li x-html="$th('app.exams.guide.step1', { deck: examSheet.exam.deck })"></li>
              <li x-html="$th('app.exams.guide.step2desktop')"></li>
              <li x-html="$th('app.exams.guide.step3')"></li>
              <li x-html="$th('app.exams.guide.step4', { tag: examSheet.exam.tag })"></li>
            </ol>
            <p class="hint" x-show="reviewInAnki || examSheet.exam.deck" x-text="$t('app.exams.guide.after')"></p>
            <div x-show="!reviewInAnki && !examSheet.exam.deck">
              <p class="hint" x-html="$th('app.exams.guide.noDeck')"></p>
              <p class="exam-search">
                <code x-text="examSheet.exam.search"></code>
                <button type="button" class="chip-btn" @click="copyExamSearch(examSheet.exam)"
                        x-text="examSheet.copied ? $t('app.exams.guide.copied') : $t('app.exams.guide.copy')"></button>
              </p>
            </div>
          </section>
          <!-- Lessons not (all) in Anki: sent from here, without opening each -->
          <button type="button" class="btn soft" x-show="anki.available && !off('anki.send') && unsentLessons(examSheet.exam).length > 1"
                  @click="sendExamLessons(examSheet.exam, unsentLessons(examSheet.exam))" :disabled="examSheet.busy"
                  x-text="examSheet.sendingLeft ? $t('app.exams.sending', { count: examSheet.sendingLeft }) : $t('app.exams.sendAll', { count: unsentLessons(examSheet.exam).length })"></button>
          <ul class="child-rows exam-lessons">
            <template x-for="p in examSheet.exam.lessons" :key="p.lesson">
              <li>
                <div class="child-row static">
                  <strong x-text="examLessonTitle(p)"></strong>
                  <small class="muted" x-text="p.cards === null ? $t('app.exams.whole') : $t('app.exams.some', { count: p.total })"></small>
                  <small class="muted" x-show="p.in_anki" x-text="$t('app.exams.inAnki', { sent: p.in_anki, total: p.total })"></small>
                  <small class="warn" x-show="!p.in_anki" x-text="$t('app.exams.notSent')"></small>
                </div>
                <div class="exam-actions">
                  <button type="button" class="chip-btn" x-show="anki.available && !off('anki.send') && p.in_anki < p.total"
                          @click="sendExamLessons(examSheet.exam, [p])" :disabled="examSheet.busy" x-text="$t('app.exams.send')"></button>
                  <button type="button" class="chip-btn" x-show="p.lesson === lessonId" @click="startPick(examSheet.exam)" x-text="$t('app.exams.pickCards')"></button>
                  <button type="button" class="chip-btn" x-show="p.lesson !== lessonId" @click="pickIn(examSheet.exam, p)" x-text="$t('app.exams.openLesson')"></button>
                  <button type="button" class="chip-btn" @click="removeExamLesson(examSheet.exam, p)" :disabled="examSheet.busy" x-text="$t('app.exams.remove')"></button>
                </div>
              </li>
            </template>
          </ul>
          <p class="hint" x-show="!examSheet.exam.lessons.length" x-text="$t('app.exams.noLessons')"></p>
          <button type="button" class="btn soft" @click="startAdding()" :disabled="examSheet.busy" x-text="$t('app.exams.addLessons')"></button>
          <p class="hint"><span x-text="$t('app.exams.tag')"></span> : <code x-text="examSheet.exam.tag"></code></p>
          <div class="sheet-actions">
            <button type="button" class="btn danger-soft" @click="deleteExam(examSheet.exam)" :disabled="examSheet.busy" x-text="$t('app.exams.delete')"></button>
          </div>
          <p class="hint error-text" x-show="examSheet.error" x-text="examSheet.error"></p>
        </div>
      </template>
    </div>

    <!-- Lessons added to the test, whole: the child's lessons not in it yet, ticked (in the
         page only then: its search isn't the lessons list's) -->
    <template x-if="examSheet.view === 'add'">
    <div class="sheet-body children">
      <input type="search" class="lesson-search" x-model="examSheet.adding.query"
             :placeholder="$t('app.lessons.search')" :aria-label="$t('app.lessons.search')">
      <ul class="child-rows exam-add">
        <template x-for="l in addable(examSheet.exam)" :key="l.id">
          <li>
            <label class="child-row static">
              <input type="checkbox" :checked="examSheet.adding.chosen.includes(l.id)" @change="toggleAdding(l.id)">
              <strong x-text="l.title"></strong>
            </label>
          </li>
        </template>
      </ul>
      <p class="empty" x-show="!addable(examSheet.exam).length" x-text="$t('app.lessons.none')"></p>
      <div class="sheet-actions">
        <button type="button" class="btn primary" @click="finishAdding()" :disabled="examSheet.busy || !examSheet.adding.chosen.length"
                x-text="$t('app.exams.addChosen', { count: examSheet.adding.chosen.length })"></button>
      </div>
      <p class="hint error-text" x-show="examSheet.error" x-text="examSheet.error"></p>
    </div>
    </template>
  </aside>

  <!-- The open lesson copied for another child (app-children.js) -->
  <div class="sheet-backdrop" x-cloak x-show="copySheet.open" x-transition.opacity @click="copySheet.open = false"></div>
  <aside class="sheet" x-cloak x-show="copySheet.open" @keydown.escape.window="copySheet.open = false"
         role="dialog" :aria-label="$t('app.copy.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="$t('app.copy.title')"></h2>
      <button class="icon-btn" @click="copySheet.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body children">
      <p class="hint" x-text="$t('app.copy.hint')"></p>
      <ul class="child-rows">
        <template x-for="c in copyTargets()" :key="c.id">
          <li>
            <button type="button" class="child-row" @click="copyFor(c)" :disabled="copySheet.busy">
              <strong x-text="c.name"></strong>
              <small class="muted" x-text="c.grade"></small>
              <small class="muted" x-show="c.anki_profile && !ofProfile(c)" x-text="'👤 ' + c.anki_profile"></small>
            </button>
          </li>
        </template>
      </ul>
      <p class="hint error-text" x-show="copySheet.error" x-text="copySheet.error"></p>
    </div>
  </aside>

  <!-- Content the AI made, reported (app-report.js): what, why, exactly what is sent -->
  <div class="sheet-backdrop" x-cloak x-show="report.open" x-transition.opacity @click="report.open = false"></div>
  <aside class="sheet" x-cloak x-show="report.open" @keydown.escape.window="report.open = false"
         role="dialog" :aria-label="$t('app.report.title')">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 x-text="$t('app.report.title')"></h2>
      <button class="icon-btn" @click="report.open = false" :aria-label="$t('common.close')">✕</button>
    </div>
    <div class="sheet-body report">
      <template x-if="report.card && !report.sent">
        <div>
          <div class="chips" x-show="reportKinds(report.card).length > 1">
            <template x-for="k in reportKinds(report.card)" :key="k">
              <button type="button" class="chip" :class="{ active: report.kind === k }" :aria-pressed="String(report.kind === k)"
                      @click="report.kind = k" x-text="$t('app.report.kinds.' + k)"></button>
            </template>
          </div>
          <fieldset class="report-reasons">
            <legend x-text="$t('app.report.why')"></legend>
            <template x-for="r in ['offensive', 'wrong', 'other']" :key="r">
              <label class="radio">
                <input type="radio" name="report-reason" :value="r" x-model="report.reason">
                <span x-text="$t('app.report.reasons.' + r)"></span>
              </label>
            </template>
          </fieldset>
          <label class="field">
            <span x-text="$t('app.report.comment')"></span>
            <textarea x-model="report.comment" rows="2" maxlength="1000"></textarea>
          </label>
          <p class="hint" x-text="$t('app.report.sent')"></p>
          <pre class="report-preview" x-text="reportContent()"></pre>
          <p class="hint" x-show="report.kind === 'picture'" x-text="$t('app.report.withPicture')"></p>
          <p class="hint error-text" x-show="report.error" x-text="report.error"></p>
          <div class="sheet-actions">
            <button type="button" class="btn soft" @click="report.open = false" x-text="$t('common.cancel')"></button>
            <button type="button" class="btn primary" @click="sendReport()" :disabled="report.sending || !report.reason"
                    x-text="$t('app.report.send')"></button>
          </div>
        </div>
      </template>
      <template x-if="report.sent">
        <div>
          <p x-text="$t('app.report.thanks')"></p>
          <div class="sheet-actions">
            <button type="button" class="btn danger-soft" x-show="!readOnly() && report.kind !== 'explanation'" @click="dropReported()"
                    x-text="$t('app.report.drop.' + report.kind)"></button>
            <button type="button" class="btn primary" @click="report.open = false" x-text="$t('common.close')"></button>
          </div>
        </div>
      </template>
    </div>
  </aside>

  <!-- The app's first launch: a parent's tool, the AI it uses, the privacy policy; accepted
       to go on (nothing ticked beforehand), not closed otherwise -->
  <div class="sheet-backdrop top" x-cloak x-show="welcome.open"></div>
  <aside class="sheet top welcome" x-cloak x-show="welcome.open" role="dialog" aria-modal="true" :aria-label="$t('app.welcome.title')">
    <div class="sheet-head">
      <h2 x-text="$t('app.welcome.title')"></h2>
    </div>
    <div class="sheet-body">
      <p><strong x-text="$t('app.welcome.parentTitle')"></strong> <span x-text="$t('app.welcome.parent')"></span></p>
      <p><strong x-text="$t('app.welcome.aiTitle')"></strong> <span x-text="$t('app.welcome.ai')"></span>
        <strong x-text="$t('app.welcome.onPhone')"></strong> <span x-text="$t('app.welcome.google')"></span></p>
      <p><strong x-text="$t('app.welcome.guardTitle')"></strong> <span x-text="$t('app.welcome.guard')"></span></p>
      <p><strong x-text="$t('app.welcome.nameTitle')"></strong> <span x-text="$t('app.welcome.name')"></span></p>
      <!-- The free trial (Play Integrity, a fingerprint of the phone): said before the first lesson starts it -->
      <p><strong x-text="$t('app.welcome.trialTitle')"></strong> <span x-text="$t('app.welcome.trial')"></span></p>
      <p><a :href="$docs('app-privacy')" target="_blank" rel="noopener" x-text="$t('app.welcome.policy')"></a></p>
      <label class="welcome-agree">
        <input type="checkbox" x-model="welcome.agreed">
        <span x-text="$t('app.welcome.agree')"></span>
      </label>
      <div class="sheet-actions">
        <button type="button" class="btn primary wide" @click="acceptWelcome()" :disabled="!welcome.agreed || welcome.busy"
                x-text="$t('app.welcome.accept')"></button>
      </div>
    </div>
  </aside>

  <!-- After a send: the lesson's notes in Anki no card has any more (cards deleted, or remade
       with another front): deleted only when asked -->
  <div class="sheet-backdrop top" x-cloak x-show="leftovers.open" x-transition.opacity @click="leftovers.open = false"></div>
  <aside class="sheet top" x-cloak x-show="leftovers.open"
         x-transition:enter="sheet-anim" x-transition:enter-start="sheet-down"
