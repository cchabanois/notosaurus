<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Other sites (fonts, CDN, links) never get this page's address: it may hold the pairing token -->
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#eaf3fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Notosaurus</title>
  <link rel="icon" href="notosaurus-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="notosaurus-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="notosaurus-touch-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script defer src="i18n.js"></script>
  <script defer src="admin.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
<!-- The setup assistant: the AI and its key, then the phone. The rest keeps its defaults
     (all of it in the settings page). -->
<div class="app has-bar" x-data="setup">

  <header class="appbar">
    <a class="brand" href="./">
      <span class="back">←</span>
      <img class="brand-logo" src="logo-mark.webp" alt="" width="44" height="44">
      <span x-text="$t('setup.title')"></span>
    </a>
  </header>

  <div class="toast" x-cloak x-show="error" x-transition.opacity role="alert">
    <span x-text="error"></span>
    <button @click="error = ''" :aria-label="$t('common.close')">✕</button>
  </div>

  <main>
    <!-- Anki add-on, opened from a phone: the assistant only opens on the computer -->
    <section class="panel" x-cloak x-show="status && !status.allowed">
      <h2>🖥️ <span x-text="$t('setup.title')"></span></h2>
      <p class="hint" x-text="$t('setup.computerOnly')"></p>
    </section>

    <!-- First visit (server without Anki): the settings' password first -->
    <section class="panel" x-cloak x-show="status?.allowed && status.password_needed && !status.password_set">
      <h2 x-text="$t('admin.create.title')"></h2>
      <p class="hint" x-text="$t('admin.create.hint')"></p>
      <form @submit.prevent="createPassword()">
        <label class="field"><span x-text="$t('admin.password')"></span>
          <input type="password" x-model="pw.new" autocomplete="new-password" minlength="4" required></label>
        <label class="field"><span x-text="$t('admin.confirm')"></span>
          <input type="password" x-model="pw.confirm" autocomplete="new-password" required></label>
        <button class="btn primary wide" x-text="$t('admin.create.button')"></button>
      </form>
    </section>

    <section class="panel" x-cloak x-show="status?.allowed && status.password_needed && status.password_set && !unlocked">
      <h2 x-text="$t('admin.locked.title')"></h2>
      <form @submit.prevent="unlock()">
        <label class="field"><span x-text="$t('admin.locked.password')"></span>
          <input type="password" x-model="pw.login" x-ref="login" autocomplete="current-password" required></label>
        <button class="btn primary wide" x-text="$t('admin.locked.button')"></button>
      </form>
    </section>

    <template x-if="unlocked && form">
      <div>
        <!-- Where one is: three steps -->
        <ol class="setup-progress">
          <template x-for="(s, i) in steps" :key="s">
            <li :class="{ active: step === s, done: steps.indexOf(step) > i }" :aria-current="step === s ? 'step' : null">
              <span class="step" x-text="steps.indexOf(step) > i ? '✓' : i + 1"></span>
              <span x-text="$t(`setup.steps.${s}`)"></span>
            </li>
          </template>
        </ol>

        <!-- 1. The AI that reads the lessons, its key, and the check -->
        <section class="panel setup-step" x-show="step === 'ai'">
          <h2 tabindex="-1" x-text="$t('setup.ai.title')"></h2>
          <p class="hint" x-text="$t('setup.ai.hint')"></p>
          <div class="options">
            <template x-for="p in shownProviders()" :key="p.id">
              <label class="option" :class="{ active: form.llm === p.id }">
                <input type="radio" name="llm" :value="p.id" x-model="form.llm" @change="providerChanged(); testResult = null">
                <strong x-text="$t(`admin.provider.${p.id}.name`)"></strong>
                <small class="recommended" x-show="recommended(p.id)" x-text="$t('setup.ai.recommended')"></small>
                <small x-text="$t(`admin.provider.${p.id}.description`)"></small>
              </label>
            </template>
          </div>

          <!-- Gemini: how to get the key, step by step -->
          <div class="setup-guide" x-show="form.llm === 'gemini'">
            <h3 x-text="$t('setup.ai.geminiTitle')"></h3>
            <ol>
              <li x-html="$t('setup.ai.gemini1')"></li>
              <li x-html="$t('setup.ai.gemini2')"></li>
              <li x-text="$t('setup.ai.gemini3')"></li>
            </ol>
            <p class="hint warn" x-text="$t('setup.ai.billing')"></p>
          </div>

          <label class="field" x-show="form.llm === 'compatible'">
            <span x-text="$t('admin.access.apiAddress')"></span>
            <input x-model="form.compatible_base_url" placeholder="http://localhost:11434/v1">
            <small x-html="$t('admin.access.ollamaHint')"></small>
          </label>
          <template x-for="k in keysForProvider()" :key="k.field">
            <div class="field">
              <label :for="k.field"><span x-text="$t(k.label)"></span></label>
              <input type="password" :id="k.field" x-model="keys[k.field]" autocomplete="off"
                     @blur="commitKey(k.field)" @keydown.enter.prevent="commitKey(k.field)"
                     :placeholder="savedKey(k.field) ? $t('admin.access.keySaved', { masked: savedKey(k.field) }) : $t('admin.access.pasteKey')">
              <small x-show="k.help && form.llm !== 'gemini'" x-html="k.help && $t(k.help)"></small>
              <small x-show="k.keyUrl"><span x-text="$t('admin.service.keyAt')"></span>
                <a :href="k.keyUrl" target="_blank" rel="noopener" x-text="k.keyUrl?.replace('https://', '')"></a>.</small>
            </div>
          </template>
          <p class="hint" x-show="form.llm !== 'gemini'">
            <a :href="$docs('ai-services')" target="_blank" rel="noopener" x-text="$t('setup.ai.otherHelp')"></a>
          </p>

          <button type="button" class="btn soft wide" @click="test()" :disabled="testing">
            <span x-text="testing ? $t('admin.testing') : $t('setup.ai.check')"></span>
          </button>
          <p class="test-result" x-show="testResult" :class="testResult?.ok ? 'ok' : 'ko'" x-text="testResult?.text"></p>
          <div class="setup-nav">
            <button type="button" class="btn primary wide" :disabled="!aiReady()" @click="go('phone')" x-text="$t('setup.next')"></button>
          </div>
        </section>

        <!-- 2. The phone: scan the QR code; the page sees it arrive -->
        <section class="panel setup-step phones" x-show="step === 'phone'">
          <h2 tabindex="-1" x-text="$t('setup.phone.title')"></h2>
          <p class="hint" x-text="$t('setup.phone.hint')"></p>
          <img class="qr" x-show="phone" :src="phone && '/api/qr?' + new URLSearchParams({ text: phone.url })" :alt="$t('admin.phones.qr')" width="200" height="200">
          <p class="setup-waiting" x-show="!phonePaired" role="status">
            <span class="spinner" aria-hidden="true"></span> <span x-text="$t('setup.phone.waiting')"></span>
          </p>
          <p class="test-result ok" x-show="phonePaired" role="status" x-text="$t('setup.phone.paired')"></p>
          <p class="hint" x-text="$t('setup.phone.sameWifi')"></p>
          <div class="setup-nav">
            <button type="button" class="btn soft" @click="go('ai')" x-text="$t('setup.back')"></button>
            <button type="button" class="btn primary" @click="go('done')" x-text="phonePaired ? $t('setup.next') : $t('setup.phone.later')"></button>
          </div>
        </section>

        <!-- 3. Ready -->
        <section class="panel setup-step setup-done" x-show="step === 'done'">
          <img src="logo-mark.webp" alt="" width="96" height="96">
          <h2 tabindex="-1" x-text="$t('setup.done.title')"></h2>
          <p x-text="phonePaired ? $t('setup.done.onPhone') : $t('setup.done.here')"></p>
          <p class="hint" x-text="$t('setup.done.more')"></p>
          <div class="setup-nav">
            <a class="btn soft" href="admin.html" x-text="$t('setup.done.settings')"></a>
            <a class="btn primary" href="./" x-text="$t('setup.done.open')"></a>
          </div>
        </section>
      </div>
    </template>

    <footer class="page-footer">
      <a class="docs-link" :href="$docs('getting-started')" target="_blank" rel="noopener">📖 <span x-text="$t('common.help')"></span></a>
      <label class="lang-select">
        <span aria-hidden="true">🌐</span>
        <select :aria-label="$t('common.language')" :value="$store.i18n.choice"
                @change="setLanguage($event.target.value)">
          <option value="" :selected="!$store.i18n.choice"
                  x-text="$t('common.languageAuto', { name: $store.i18n.names[$store.i18n.auto] || $store.i18n.auto })"></option>
          <template x-for="code in $store.i18n.available" :key="code">
            <option :value="code" :selected="$store.i18n.choice === code" x-text="$store.i18n.names[code] || code"></option>
          </template>
        </select>
      </label>
    </footer>
  </main>

</div>
</body>
</html>
