<!doctype html>
<!-- The image shown when the documentation's address is shared (docs/public/og.jpg, 1200x630):
     open this file in a 1200x630 window, take a screenshot, save it as a JPEG. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: 'Nunito', sans-serif; }
  body {
    display: flex; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box; color: #fff;
    background: radial-gradient(circle at 15% 15%, #1b8aa0 0, transparent 55%),
                radial-gradient(circle at 95% 95%, #2f9b6a 0, transparent 50%),
                linear-gradient(160deg, #0b4f60, #0a3440 60%, #0d3b33);
  }
  img { width: 440px; border-radius: 44px; box-shadow: 0 24px 50px rgba(0,0,0,.4); }
  h1 { font-size: 78px; font-weight: 900; margin: 0 0 18px; letter-spacing: -1px; }
  p { font-size: 46px; font-weight: 800; line-height: 1.15; margin: 0 0 26px; }
  small { font-size: 30px; font-weight: 800; opacity: .85; }
</style></head>
<body>
  <img src="../src/assets/logo.webp" alt="">
  <div>
    <h1>Notosaurus</h1>
    <p>Snap a lesson.<br>Get Anki cards.</p>
    <small>Free &amp; open source · for Anki</small>
  </div>
</body></html>
